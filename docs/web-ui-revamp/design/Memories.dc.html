<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Memories</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070A12}
a{color:#8EA6FF}a:hover{color:#B7C6FF}
.ht{--ink:#070A12;--surface:rgba(22,29,47,.55);--surface-solid:#121828;--surface-strong:rgba(22,29,47,.78);--raised:rgba(255,255,255,.05);--line:rgba(255,255,255,.09);--line-strong:rgba(255,255,255,.17);--text-1:#EDF1F8;--text-2:#B6BFCF;--text-3:#8E98AC;--primary:#3D63F0;--primary-hover:#5174FF;--primary-text:#8EA6FF;--primary-soft:rgba(61,99,240,.18);--cyan:#2DD4EF;--cyan-text:#67E3F5;--orange:#FF6A1F;--orange-hover:#FF8340;--orange-soft:rgba(255,106,31,.14);--unpaid:#F5A524;--glow:0 0 10px rgba(45,212,239,.7);--blur:blur(22px) saturate(160%);--glass-hi:inset 0 1px 0 rgba(255,255,255,.07);--shadow:0 8px 24px rgba(0,0,0,.28);--shadow-lift:0 16px 40px rgba(0,0,0,.45);--dots:rgba(255,255,255,.03);--pb-blue:rgba(61,99,240,.2);--pf-blue:#A5B8FF;--pb-green:rgba(34,197,94,.16);--pf-green:#6EE7A0;--pb-amber:rgba(245,165,36,.16);--pf-amber:#FCC560;--pb-red:rgba(244,63,94,.16);--pf-red:#FDA4B4;--pb-violet:rgba(167,139,250,.18);--pf-violet:#C4B5FD;--pb-cyan:rgba(45,212,239,.14);--pf-cyan:#67E3F5;--pb-gray:rgba(255,255,255,.07);--pf-gray:#B6BFCF;--f-display:'Space Grotesk',system-ui,sans-serif;--f-body:'IBM Plex Sans',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,monospace;position:relative;isolation:isolate;font-family:var(--f-body);color:var(--text-2);background-color:var(--ink);background-image:radial-gradient(var(--dots) 1px,transparent 1px);background-size:24px 24px;-webkit-font-smoothing:antialiased;color-scheme:dark}
.ht.light{--ink:#EDF1F8;--surface:rgba(255,255,255,.6);--surface-solid:#FFFFFF;--surface-strong:rgba(255,255,255,.82);--raised:rgba(255,255,255,.65);--line:rgba(14,21,37,.08);--line-strong:rgba(14,21,37,.16);--text-1:#0E1525;--text-2:#3B4558;--text-3:#5A6478;--primary-hover:#3254D6;--primary-text:#2F52D8;--primary-soft:rgba(61,99,240,.1);--cyan:#06B6D4;--cyan-text:#0E7490;--orange-soft:rgba(255,106,31,.1);--glow:0 0 8px rgba(6,182,212,.55);--glass-hi:inset 0 1px 0 rgba(255,255,255,.9);--shadow:0 8px 24px rgba(30,41,82,.08);--shadow-lift:0 16px 40px rgba(30,41,82,.14);--dots:rgba(14,21,37,.04);--pb-blue:rgba(61,99,240,.1);--pf-blue:#2F52D8;--pb-green:rgba(34,197,94,.12);--pf-green:#15803D;--pb-amber:rgba(245,165,36,.16);--pf-amber:#92400E;--pb-red:rgba(244,63,94,.1);--pf-red:#BE123C;--pb-violet:rgba(124,92,224,.1);--pf-violet:#6D28D9;--pb-cyan:rgba(6,182,212,.12);--pf-cyan:#0E7490;--pb-gray:rgba(14,21,37,.06);--pf-gray:#3B4558;color-scheme:light}
.ht .aurora{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(640px 440px at 14% 6%,rgba(61,99,240,.34),transparent 70%),radial-gradient(560px 420px at 88% 14%,rgba(124,92,224,.26),transparent 70%),radial-gradient(620px 460px at 72% 96%,rgba(45,212,239,.16),transparent 70%),radial-gradient(420px 320px at 22% 88%,rgba(255,106,31,.11),transparent 70%)}
.ht.light .aurora{background:radial-gradient(640px 440px at 14% 6%,rgba(61,99,240,.2),transparent 70%),radial-gradient(560px 420px at 88% 14%,rgba(124,92,224,.16),transparent 70%),radial-gradient(620px 460px at 72% 96%,rgba(6,182,212,.14),transparent 70%),radial-gradient(420px 320px at 22% 88%,rgba(255,106,31,.1),transparent 70%)}
.ht .glass{-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--glass-hi),var(--shadow)}
.ht button,.ht input,.ht select,.ht textarea{font-family:inherit}
.ht select option{background:var(--surface-solid);color:var(--text-1)}
.ht .row-h:hover,.ht .nav-a:hover,.ht .btn-s:hover,.ht .btn-i:hover{background:var(--raised)}
.ht .btn-p:hover{background:var(--primary-hover);color:#FFFFFF}
.ht .btn-o:hover{background:var(--orange-hover);color:#0A0E17}
.ht .card-h{transition:box-shadow .18s ease,border-color .18s ease,transform .18s ease}
.ht .card-h:hover{box-shadow:var(--glass-hi),var(--shadow-lift);border-color:var(--line-strong);transform:translateY(-2px)}
.ht :focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.ht .card-h:hover{transform:none}}
</style>
</helmet>
<div class="ht {{themeCls}}" style="min-height: 100vh; display: flex; flex-direction: column;">
  <div class="aurora" aria-hidden="true"></div>

  <header class="glass" style="position: sticky; top: 0; z-index: 2; min-height: 64px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 32px; border-bottom: 1px solid var(--line); background: var(--surface);">
    <a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 10px; text-decoration: none;">
      <img src="/_blob/2361260a942726892d672ff0d59d40d6" alt="Heubert Tracker" style="width: 32px; height: 32px; border-radius: 9px; object-fit: cover;">
    </a>
    <span style="font-family: var(--f-display); font-size: 18px; font-weight: 700; color: var(--text-1); letter-spacing: -0.01em;">Memories</span>
    <div style="margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;">
      <a class="btn-s glass" href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; box-sizing: border-box; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); color: var(--text-1); font-size: 14px; font-weight: 600; text-decoration: none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
        Back to Dashboard
      </a>
      <button class="btn-p" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--primary); color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 6px 20px rgba(61,99,240,.35);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        Add Memory
      </button>
    </div>
  </header>

  <main style="box-sizing: border-box; width: 100%; padding: 32px; display: flex; flex-direction: column; gap: 20px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--cyan-text);">Team wall · 12 memories</span>
      <h1 style="margin: 0; font-family: var(--f-display); font-size: 34px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; color: var(--text-1);">Team Memories</h1>
      <p style="margin: 0; font-size: 15px; color: var(--text-3);">Capturing our journey, from standups to celebrations.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div role="group" aria-label="Filter by year" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px;">
        <span style="width: 56px; font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3);">Year</span>
        <sc-for list="{{years}}" as="y" hint-placeholder-count="4">
          <button aria-pressed="{{y.pressed}}" style="height: 32px; padding: 0 14px; border: 1px solid {{y.border}}; border-radius: 9999px; background: {{y.bg}}; color: {{y.fg}}; font-family: var(--f-mono); font-size: 13px; font-weight: 500; cursor: pointer;">{{y.label}}</button>
        </sc-for>
      </div>
      <div role="group" aria-label="Filter by event" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px;">
        <span style="width: 56px; font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3);">Event</span>
        <sc-for list="{{events}}" as="e" hint-placeholder-count="6">
          <button aria-pressed="{{e.pressed}}" style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; border: 1px solid {{e.border}}; border-radius: 9999px; background: {{e.bg}}; color: {{e.fg}}; font-size: 13px; font-weight: 600; cursor: pointer;">
            {{e.label}}
            <span style="font-family: var(--f-mono); font-size: 12px; font-weight: 500; color: var(--text-3);">{{e.count}}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <section aria-label="Memories" style="columns: 260px; column-gap: 16px;">
      <sc-for list="{{memories}}" as="m" hint-placeholder-count="12">
        <article class="glass card-h" style="display: inline-flex; flex-direction: column; width: 100%; box-sizing: border-box; margin: 0 0 16px; break-inside: avoid; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); overflow: hidden;">
          <sc-if value="{{m.isImage}}" hint-placeholder-val="{{true}}">
            <button aria-label="Open {{m.caption}}" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; width: 100%; height: {{m.h}}; padding: 16px; box-sizing: border-box; border: 0; border-bottom: 1px solid var(--line); background: var(--raised); color: var(--text-3); cursor: zoom-in;">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM9 7a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM21 15l-3.09-3.09a2 2 0 0 0-2.82 0L6 21"></path></svg>
              <span style="font-family: var(--f-mono); font-size: 12px; text-align: center; color: var(--text-3);">{{m.placeholder}}</span>
            </button>
          </sc-if>
          <sc-if value="{{m.isVideo}}" hint-placeholder-val="{{false}}">
            <button aria-label="Play {{m.caption}}" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; width: 100%; height: {{m.h}}; padding: 16px; box-sizing: border-box; border: 0; border-bottom: 1px solid var(--line); background: var(--raised); color: var(--text-3); cursor: pointer;">
              <span style="width: 52px; height: 52px; border-radius: 9999px; background: var(--primary); color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(61,99,240,.45);">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg>
              </span>
              <span style="font-family: var(--f-mono); font-size: 12px; text-align: center; color: var(--text-3);">{{m.placeholder}}</span>
              <span style="position: absolute; top: 10px; left: 10px; height: 22px; padding: 0 8px; border-radius: 9999px; background: var(--pb-violet); color: var(--pf-violet); font-size: 12px; font-weight: 600; display: inline-flex; align-items: center;">Video</span>
            </button>
          </sc-if>
          <sc-if value="{{m.isText}}" hint-placeholder-val="{{false}}">
            <div style="position: relative; padding: 22px 20px 6px; display: flex; flex-direction: column; gap: 8px;">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--cyan-text);"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.76-2.02-2-2H4c-1.25 0-2 .75-2 1.97V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .01-1 1.03V20c0 1 0 1 1 1zM15 21c3 0 7-1 7-8V5c0-1.25-.76-2.02-2-2h-4c-1.25 0-2 .75-2 1.97V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"></path></svg>
              <p style="margin: 0; font-family: var(--f-display); font-size: 17px; line-height: 1.45; font-weight: 500; color: var(--text-1);">{{m.message}}</p>
            </div>
          </sc-if>
          <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 14px;">
            <h2 style="margin: 0; font-size: 14px; line-height: 1.4; font-weight: 600; color: var(--text-1);">{{m.caption}}</h2>
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="width: 24px; height: 24px; flex-shrink: 0; border-radius: 9999px; background: {{m.av}}; color: {{m.avFg}}; font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;" aria-hidden="true">{{m.initials}}</span>
              <span style="font-size: 13px; color: var(--text-2);">By {{m.author}}</span>
              <span style="margin-left: auto; font-family: var(--f-mono); font-size: 12px; color: var(--text-3);">{{m.date}}</span>
            </div>
            <sc-if value="{{m.isMine}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; gap: 4px; padding-top: 8px; border-top: 1px solid var(--line);">
                <button class="btn-s" style="display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--text-2); font-size: 13px; font-weight: 500; cursor: pointer;">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
                  Edit
                </button>
                <button class="btn-s" style="display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--pf-red); font-size: 13px; font-weight: 500; cursor: pointer;">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                  Delete
                </button>
              </div>
            </sc-if>
          </div>
        </article>
      </sc-for>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"light":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    const light = this.props.light ?? false;
    const ppl = {
      AS: ['Aarav Shrestha', '#3D63F0'], SG: ['Sita Gurung', '#7C5CE0'], BT: ['Bikash Thapa', '#0B7F90'],
      PM: ['Priya Maharjan', '#B4471A'], RK: ['Rohan KC', '#3D63F0'], KJ: ['Kriti Joshi', '#7C5CE0'],
      NT: ['Nabin Tamang', '#0B7F90'], AR: ['Anisha Rai', '#B4471A'], S: ['Sanish', 'var(--orange)']
    };
    const mem = (type, who, caption, date, extra, h) => ({
      isImage: type === 'image', isVideo: type === 'video', isText: type === 'text',
      placeholder: type === 'text' ? '' : extra, message: type === 'text' ? extra : '',
      h: h || '220px', caption, date,
      author: ppl[who][0], av: ppl[who][1], avFg: who === 'S' ? '#0A0E17' : '#FFFFFF',
      initials: who === 'S' ? 'S' : who, isMine: who === 'S'
    });
    const chip = (label, on, count) => ({
      label, count: count === undefined ? '' : count, pressed: on ? 'true' : 'false',
      bg: on ? 'var(--primary-soft)' : 'var(--surface)',
      fg: on ? 'var(--text-1)' : 'var(--text-2)',
      border: on ? 'var(--primary)' : 'var(--line-strong)'
    });
    return {
      themeCls: light ? 'light' : '',
      years: [chip('All years', true), chip('2026', false), chip('2025', false), chip('2024', false)],
      events: [chip('All events', true, 12), chip('Dashain', false, 3), chip('Tihar', false, 2), chip('Birthdays', false, 3), chip('Offsite', false, 2), chip('Everyday', false, 2)],
      memories: [
        mem('image', 'SG', 'Dashain lunch at the office', 'Oct 10, 2025', '[Team photo — Dashain lunch 2025]', '240px'),
        mem('text', 'KJ', 'Standup streak', 'Oct 16, 2026', 'Rohan joined standup on time three days running. Pinning it here as proof.'),
        mem('image', 'NT', 'Deusi night', 'Nov 2, 2025', '[Team photo — Tihar deusi 2025]', '300px'),
        mem('video', 'AS', '[Offsite clip caption]', 'Mar 14, 2026', '[Video — team offsite 2026]', '200px'),
        mem('image', 'S', 'Anisha’s birthday cake', 'Oct 19, 2026', '[Photo — Anisha’s birthday 2026]', '200px'),
        mem('image', 'PM', 'Tika day', 'Oct 3, 2025', '[Team photo — Dashain tika 2025]', '280px'),
        mem('text', 'BT', 'Retro wisdom', 'Sep 22, 2026', 'Best retro card this sprint: “Ship the small thing first.”'),
        mem('image', 'RK', '[Offsite group photo caption]', 'Mar 15, 2026', '[Team photo — offsite 2026]', '220px'),
        mem('image', 'AR', 'Nabin’s cake-cutting', 'Oct 25, 2024', '[Photo — Nabin’s work anniversary 2024]', '260px'),
        mem('video', 'S', 'Laxmi Puja lights', 'Nov 1, 2024', '[Video — Tihar lights 2024]', '220px'),
        mem('image', 'KJ', 'First day at the new desk', 'Jan 8, 2025', '[Photo — Kriti’s first day 2025]', '200px'),
        mem('image', 'SG', 'Kriti’s birthday', 'Oct 30, 2025', '[Photo — Kriti’s birthday 2025]', '240px')
      ]
    };
  }
}
</script>
</body>
</html>
