<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070A12}
a{color:#8EA6FF}a:hover{color:#B7C6FF}
.ht{--sidebar-bg:transparent;--ink:#070A12;--surface:rgba(22,29,47,.55);--surface-solid:#121828;--surface-strong:rgba(22,29,47,.78);--raised:rgba(255,255,255,.05);--line:rgba(255,255,255,.09);--line-strong:rgba(255,255,255,.17);--text-1:#EDF1F8;--text-2:#B6BFCF;--text-3:#8E98AC;--primary:#3D63F0;--primary-hover:#5174FF;--primary-text:#8EA6FF;--primary-soft:rgba(61,99,240,.18);--cyan:#2DD4EF;--cyan-text:#67E3F5;--orange:#FF6A1F;--orange-hover:#FF8340;--orange-soft:rgba(255,106,31,.14);--unpaid:#F5A524;--glow:0 0 10px rgba(45,212,239,.7);--blur:blur(22px) saturate(160%);--glass-hi:inset 0 1px 0 rgba(255,255,255,.07);--shadow:0 8px 24px rgba(0,0,0,.28);--shadow-lift:0 16px 40px rgba(0,0,0,.45);--dots:rgba(255,255,255,.03);--pb-blue:rgba(61,99,240,.2);--pf-blue:#A5B8FF;--pb-green:rgba(34,197,94,.16);--pf-green:#6EE7A0;--pb-amber:rgba(245,165,36,.16);--pf-amber:#FCC560;--pb-red:rgba(244,63,94,.16);--pf-red:#FDA4B4;--pb-violet:rgba(167,139,250,.18);--pf-violet:#C4B5FD;--pb-cyan:rgba(45,212,239,.14);--pf-cyan:#67E3F5;--pb-gray:rgba(255,255,255,.07);--pf-gray:#B6BFCF;--f-display:'Space Grotesk',system-ui,sans-serif;--f-body:'IBM Plex Sans',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,monospace;position:relative;isolation:isolate;font-family:var(--f-body);color:var(--text-2);background-color:var(--ink);background-image:radial-gradient(var(--dots) 1px,transparent 1px);background-size:24px 24px;-webkit-font-smoothing:antialiased;color-scheme:dark}
.ht.light{--ink:#EDF1F8;--surface:rgba(255,255,255,.6);--surface-solid:#FFFFFF;--surface-strong:rgba(255,255,255,.82);--raised:rgba(255,255,255,.65);--line:rgba(14,21,37,.08);--line-strong:rgba(14,21,37,.16);--text-1:#0E1525;--text-2:#3B4558;--text-3:#5A6478;--primary-hover:#3254D6;--primary-text:#2F52D8;--primary-soft:rgba(61,99,240,.1);--cyan:#06B6D4;--cyan-text:#0E7490;--orange-soft:rgba(255,106,31,.1);--glow:0 0 8px rgba(6,182,212,.55);--glass-hi:inset 0 1px 0 rgba(255,255,255,.9);--shadow:0 8px 24px rgba(30,41,82,.08);--shadow-lift:0 16px 40px rgba(30,41,82,.14);--dots:rgba(14,21,37,.04);--pb-blue:rgba(61,99,240,.1);--pf-blue:#2F52D8;--pb-green:rgba(34,197,94,.12);--pf-green:#15803D;--pb-amber:rgba(245,165,36,.16);--pf-amber:#92400E;--pb-red:rgba(244,63,94,.1);--pf-red:#BE123C;--pb-violet:rgba(124,92,224,.1);--pf-violet:#6D28D9;--pb-cyan:rgba(6,182,212,.12);--pf-cyan:#0E7490;--pb-gray:rgba(14,21,37,.06);--pf-gray:#3B4558;color-scheme:light}
.ht .aurora{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(640px 440px at 14% 6%,rgba(61,99,240,.34),transparent 70%),radial-gradient(560px 420px at 88% 14%,rgba(124,92,224,.26),transparent 70%),radial-gradient(620px 460px at 72% 96%,rgba(45,212,239,.16),transparent 70%),radial-gradient(420px 320px at 22% 88%,rgba(255,106,31,.11),transparent 70%)}
.ht.light .aurora{background:radial-gradient(640px 440px at 14% 6%,rgba(61,99,240,.2),transparent 70%),radial-gradient(560px 420px at 88% 14%,rgba(124,92,224,.16),transparent 70%),radial-gradient(620px 460px at 72% 96%,rgba(6,182,212,.14),transparent 70%),radial-gradient(420px 320px at 22% 88%,rgba(255,106,31,.1),transparent 70%)}
.ht .glass{-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--glass-hi),var(--shadow)}
.ht button,.ht input,.ht select,.ht textarea{font-family:inherit}
.ht select option{background:var(--surface-solid);color:var(--text-1)}
.ht .row-h:hover,.ht .nav-a:hover,.ht .btn-s:hover,.ht .btn-i:hover{background:var(--raised)}
.ht .btn-p:hover{background:var(--primary-hover);color:#FFFFFF}
.ht .btn-o:hover{background:var(--orange-hover);color:#0A0E17}
.ht .card-h{transition:box-shadow .18s ease,border-color .18s ease,transform .18s ease}
.ht .card-h:hover{box-shadow:var(--glass-hi),var(--shadow-lift);border-color:var(--line-strong);transform:translateY(-2px)}
.ht :focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.ht .card-h:hover{transform:none}}
</style>
</helmet>
<div class="ht {{themeCls}}" style="min-height: 100vh; display: flex; flex-wrap: wrap; align-items: stretch;">
  <div class="aurora" aria-hidden="true"></div>
  <div class="glass" style="flex: 1 0 240px; box-sizing: border-box; background: var(--surface); border-right: 1px solid var(--line);">
    <dc-import name="Sidebar" active="tasks" hint-size="240px,1000px"></dc-import>
  </div>

  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column;">
    <header class="glass" style="min-height: 68px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 32px; border-bottom: 1px solid var(--line); background: var(--surface);">
      <label style="flex: 1 1 240px; max-width: 440px; display: flex; align-items: center; gap: 8px; height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--raised); color: var(--text-3);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3a8 8 0 1 0 0 16 8 8 0 0 0 0-16zM21 21l-4.3-4.3"></path></svg>
        <input type="search" aria-label="Search" placeholder="Search people, fines, tasks…" style="flex-grow: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 14px; color: var(--text-1);">
        <kbd style="font-family: var(--f-mono); font-size: 12px; color: var(--text-3); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px;">Ctrl K</kbd>
      </label>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 8px;">
        <a class="btn-o" href="Meeting.dc.html" style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 9999px; background: var(--orange); color: #0A0E17; font-size: 14px; font-weight: 600; text-decoration: none; box-shadow: 0 6px 20px rgba(255,106,31,.3);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 13l5.22 3.48a.5.5 0 0 0 .78-.42V7.87a.5.5 0 0 0-.75-.43L16 10.5M4 6h10a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"></path></svg>
          Start Meeting
        </a>
        <button class="btn-i" aria-label="Notifications" style="position: relative; width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 10px; background: var(--raised); color: var(--text-2); display: inline-flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
        </button>
        <button class="btn-i" aria-label="Switch theme" style="width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 10px; background: var(--raised); color: var(--text-2); display: inline-flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
        </button>
        <button class="btn-s" aria-label="Account and preferences" style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px 0 4px; border: 0; border-radius: 9999px; background: transparent; color: var(--text-1); cursor: pointer;">
          <span style="width: 32px; height: 32px; border-radius: 9999px; background: var(--orange); color: #0A0E17; font-family: var(--f-display); font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;">S</span>
          <span style="font-size: 14px; font-weight: 600;">Sanish</span>
        </button>
      </div>
    </header>

    <main style="box-sizing: border-box; width: 100%; padding: 32px; display: flex; flex-direction: column; gap: 20px;">
      <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px;">
        <div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 6px;">
          <span style="font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--cyan-text);">Sprint 42 · 10 open tasks</span>
          <h1 style="margin: 0; font-family: var(--f-display); font-size: 34px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; color: var(--text-1);">Tasks</h1>
          <p style="margin: 0; font-size: 15px; color: var(--text-3);">Plan, assign and track your team's work across projects.</p>
        </div>
        <button class="btn-p" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--primary); color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          New Task
        </button>
      </div>

      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px;">
        <label style="flex: 0 1 320px; display: flex; align-items: center; gap: 8px; height: 38px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--raised); color: var(--text-3);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3a8 8 0 1 0 0 16 8 8 0 0 0 0-16zM21 21l-4.3-4.3"></path></svg>
          <input type="search" aria-label="Search tasks" placeholder="Search title, label or issue key…" style="flex-grow: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 14px; color: var(--text-1);">
        </label>
        <select aria-label="Project" style="height: 38px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--raised); color: var(--text-1); font-size: 14px;">
          <option>All projects</option>
          <option>[Project A]</option>
          <option>[Project B]</option>
        </select>
        <div role="group" aria-label="Filter by assignee" style="display: flex; align-items: center; padding-left: 6px;">
          <sc-for list="{{filterPeople}}" as="p" hint-placeholder-count="6">
            <button aria-label="{{p.name}}" title="{{p.name}}" style="width: 32px; height: 32px; margin-left: -6px; border-radius: 9999px; border: 2px solid var(--ink); background: {{p.av}}; color: #FFFFFF; font-size: 11px; font-weight: 600; cursor: pointer;">{{p.initials}}</button>
          </sc-for>
        </div>
        <label style="margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-2); cursor: pointer;">
          <input type="checkbox" style="width: 16px; height: 16px; accent-color: #3D63F0;">
          Show all done
        </label>
      </div>

      <div style="overflow-x: auto; margin: 0 -32px; padding: 0 32px 8px;">
        <div style="display: flex; gap: 14px; align-items: flex-start; min-width: min-content;">
          <sc-for list="{{columns}}" as="col" hint-placeholder-count="5">
            <section class="glass" aria-label="{{col.label}}" style="flex: 1 0 284px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line);">
              <div style="display: flex; align-items: center; gap: 8px; padding: 2px 4px 4px;">
                <span style="width: 8px; height: 8px; border-radius: 2px; background: {{col.dot}};" aria-hidden="true"></span>
                <h2 style="margin: 0; font-family: var(--f-display); font-size: 15px; font-weight: 700; color: var(--text-1);">{{col.label}}</h2>
                <span style="font-family: var(--f-mono); font-size: 12px; color: var(--text-3);">{{col.count}}</span>
                <button class="btn-i" aria-label="Add task to {{col.label}}" style="margin-left: auto; width: 28px; height: 28px; border: 0; border-radius: 7px; background: transparent; color: var(--text-3); display: inline-flex; align-items: center; justify-content: center; cursor: pointer;">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
                </button>
              </div>
              <sc-for list="{{col.cards}}" as="c" hint-placeholder-count="3">
                <article class="card-h" style="display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border-radius: 11px; background: var(--raised); border: 1px solid var(--line); cursor: grab;">
                  <div style="display: flex; align-items: center; gap: 8px;">
                    <span style="font-family: var(--f-mono); font-size: 12px; color: var(--cyan-text);">{{c.key}}</span>
                    <span style="margin-left: auto; height: 20px; padding: 0 8px; border-radius: 9999px; background: {{c.prioBg}}; color: {{c.prioFg}}; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center;">{{c.prio}}</span>
                  </div>
                  <h3 style="margin: 0; font-size: 14px; line-height: 1.4; font-weight: 600; color: var(--text-1);">{{c.title}}</h3>
                  <div style="display: flex; flex-wrap: wrap; gap: 6px;">
                    <sc-for list="{{c.labels}}" as="lb" hint-placeholder-count="2">
                      <span style="height: 20px; padding: 0 7px; border-radius: 6px; background: var(--pb-gray); color: var(--pf-gray); font-family: var(--f-mono); font-size: 12px; display: inline-flex; align-items: center;">#{{lb}}</span>
                    </sc-for>
                  </div>
                  <div style="display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--text-3);">
                    <span title="Estimate (points)" style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 6px; border: 1px solid var(--line-strong); color: var(--text-1); font-family: var(--f-mono); font-weight: 500; display: inline-flex; align-items: center; justify-content: center;">{{c.points}}</span>
                    <span style="display: inline-flex; align-items: center; gap: 4px; color: {{c.dueColor}};">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path></svg>
                      {{c.due}}
                    </span>
                    <span style="display: inline-flex; align-items: center; gap: 4px;" title="Comments">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path></svg>
                      {{c.comments}}
                    </span>
                    <span title="{{c.assignee}}" style="margin-left: auto; width: 24px; height: 24px; border-radius: 9999px; background: {{c.av}}; color: #FFFFFF; font-size: 10px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center;">{{c.initials}}</span>
                  </div>
                </article>
              </sc-for>
            </section>
          </sc-for>
        </div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"light":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const light = this.props.light ?? false;
    const av = { AS: '#3D63F0', SG: '#7C5CE0', BT: '#0B7F90', PM: '#B4471A', RK: '#3D63F0', KJ: '#7C5CE0' };
    const names = { AS: 'Aarav Shrestha', SG: 'Sita Gurung', BT: 'Bikash Thapa', PM: 'Priya Maharjan', RK: 'Rohan KC', KJ: 'Kriti Joshi' };
    const prio = {
      Urgent: ['var(--pb-red)', 'var(--pf-red)'],
      High: ['var(--pb-amber)', 'var(--pf-amber)'],
      Medium: ['var(--pb-blue)', 'var(--pf-blue)'],
      Low: ['var(--pb-gray)', 'var(--pf-gray)']
    };
    const card = (key, title, p, labels, points, due, overdue, comments, who) => ({
      key, title, prio: p, prioBg: prio[p][0], prioFg: prio[p][1], labels, points, due,
      dueColor: overdue ? 'var(--pf-red)' : 'var(--text-3)', comments, initials: who, av: av[who], assignee: names[who]
    });
    const columns = [
      { label: 'Backlog', dot: 'var(--text-3)', cards: [
        card('HT-58', 'Export leave summary as CSV', 'Low', ['leaves'], 3, 'Nov 12', false, 0, 'SG'),
        card('HT-61', 'Attendance geofence radius per office', 'Medium', ['attendance', 'admin'], 5, 'Nov 20', false, 2, 'BT')
      ] },
      { label: 'To Do', dot: 'var(--primary)', cards: [
        card('HT-49', 'Season picker on the standup fines tab', 'High', ['fines'], 3, 'Oct 22', false, 1, 'RK'),
        card('HT-52', 'Copy poker estimate onto task card', 'Medium', ['poker', 'tasks'], 2, 'Oct 24', false, 0, 'AS'),
        card('HT-55', 'Empty state for the Memories gallery', 'Low', ['ui'], 1, 'Oct 30', false, 0, 'KJ')
      ] },
      { label: 'In Progress', dot: 'var(--unpaid)', cards: [
        card('HT-44', 'Task board drag and drop ordering', 'Urgent', ['tasks'], 8, 'Oct 18', true, 5, 'PM'),
        card('HT-47', 'Light theme for retro boards', 'High', ['retro', 'ui'], 5, 'Oct 21', false, 3, 'SG')
      ] },
      { label: 'In Review', dot: '#A78BFA', cards: [
        card('HT-41', 'Missed check-out reminder email', 'Medium', ['attendance'], 3, 'Oct 20', false, 4, 'BT')
      ] },
      { label: 'Done', dot: '#22C55E', cards: [
        card('HT-38', 'AI grouping for retro cards', 'High', ['retro'], 8, 'Oct 15', false, 6, 'AS'),
        card('HT-36', 'Banner fixes for Dashain', 'Low', ['ui'], 1, 'Oct 12', false, 1, 'KJ')
      ] }
    ].map((c) => ({ ...c, count: c.cards.length }));
    return {
      themeCls: light ? 'light' : '',
      columns,
      filterPeople: ['AS', 'SG', 'BT', 'PM', 'RK', 'KJ'].map((k) => ({ initials: k, av: av[k], name: names[k] }))
    };
  }
}
</script>
</body>
</html>
