<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Record a fine</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070A12}
a{color:#8EA6FF}a:hover{color:#B7C6FF}
.ht{--ink:#070A12;--surface:rgba(22,29,47,.55);--surface-solid:#121828;--surface-strong:rgba(22,29,47,.78);--raised:rgba(255,255,255,.05);--line:rgba(255,255,255,.09);--line-strong:rgba(255,255,255,.17);--text-1:#EDF1F8;--text-2:#B6BFCF;--text-3:#8E98AC;--primary:#3D63F0;--primary-hover:#5174FF;--primary-text:#8EA6FF;--primary-soft:rgba(61,99,240,.18);--cyan:#2DD4EF;--cyan-text:#67E3F5;--orange:#FF6A1F;--orange-hover:#FF8340;--orange-soft:rgba(255,106,31,.14);--unpaid:#F5A524;--glow:0 0 10px rgba(45,212,239,.7);--blur:blur(22px) saturate(160%);--glass-hi:inset 0 1px 0 rgba(255,255,255,.07);--shadow:0 8px 24px rgba(0,0,0,.28);--shadow-lift:0 16px 40px rgba(0,0,0,.45);--dots:rgba(255,255,255,.03);--pb-blue:rgba(61,99,240,.2);--pf-blue:#A5B8FF;--pb-green:rgba(34,197,94,.16);--pf-green:#6EE7A0;--pb-amber:rgba(245,165,36,.16);--pf-amber:#FCC560;--pb-red:rgba(244,63,94,.16);--pf-red:#FDA4B4;--pb-violet:rgba(167,139,250,.18);--pf-violet:#C4B5FD;--pb-cyan:rgba(45,212,239,.14);--pf-cyan:#67E3F5;--pb-gray:rgba(255,255,255,.07);--pf-gray:#B6BFCF;--f-display:'Space Grotesk',system-ui,sans-serif;--f-body:'IBM Plex Sans',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,monospace;position:relative;isolation:isolate;font-family:var(--f-body);color:var(--text-2);background-color:var(--ink);background-image:radial-gradient(var(--dots) 1px,transparent 1px);background-size:24px 24px;-webkit-font-smoothing:antialiased;color-scheme:dark}
.ht.light{--ink:#EDF1F8;--surface:rgba(255,255,255,.6);--surface-solid:#FFFFFF;--surface-strong:rgba(255,255,255,.82);--raised:rgba(255,255,255,.65);--line:rgba(14,21,37,.08);--line-strong:rgba(14,21,37,.16);--text-1:#0E1525;--text-2:#3B4558;--text-3:#5A6478;--primary-hover:#3254D6;--primary-text:#2F52D8;--primary-soft:rgba(61,99,240,.1);--cyan:#06B6D4;--cyan-text:#0E7490;--orange-soft:rgba(255,106,31,.1);--glow:0 0 8px rgba(6,182,212,.55);--glass-hi:inset 0 1px 0 rgba(255,255,255,.9);--shadow:0 8px 24px rgba(30,41,82,.08);--shadow-lift:0 16px 40px rgba(30,41,82,.14);--dots:rgba(14,21,37,.04);--pb-blue:rgba(61,99,240,.1);--pf-blue:#2F52D8;--pb-green:rgba(34,197,94,.12);--pf-green:#15803D;--pb-amber:rgba(245,165,36,.16);--pf-amber:#92400E;--pb-red:rgba(244,63,94,.1);--pf-red:#BE123C;--pb-violet:rgba(124,92,224,.1);--pf-violet:#6D28D9;--pb-cyan:rgba(6,182,212,.12);--pf-cyan:#0E7490;--pb-gray:rgba(14,21,37,.06);--pf-gray:#3B4558;color-scheme:light}
.ht .aurora{position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(640px 440px at 14% 6%,rgba(61,99,240,.34),transparent 70%),radial-gradient(560px 420px at 88% 14%,rgba(124,92,224,.26),transparent 70%),radial-gradient(620px 460px at 72% 96%,rgba(45,212,239,.16),transparent 70%),radial-gradient(420px 320px at 22% 88%,rgba(255,106,31,.11),transparent 70%)}
.ht.light .aurora{background:radial-gradient(640px 440px at 14% 6%,rgba(61,99,240,.2),transparent 70%),radial-gradient(560px 420px at 88% 14%,rgba(124,92,224,.16),transparent 70%),radial-gradient(620px 460px at 72% 96%,rgba(6,182,212,.14),transparent 70%),radial-gradient(420px 320px at 22% 88%,rgba(255,106,31,.1),transparent 70%)}
.ht .glass{-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--glass-hi),var(--shadow)}
.ht .scrim{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ht button,.ht input,.ht select,.ht textarea{font-family:inherit}
.ht select option{background:var(--surface-solid);color:var(--text-1)}
.ht .btn-s:hover,.ht .btn-i:hover{background:var(--raised)}
.ht .btn-p:hover{background:var(--primary-hover);color:#FFFFFF}
.ht :focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
</style>
</helmet>
<div class="ht {{themeCls}}" style="width: 1440px; height: 900px; overflow: hidden;">
  <div class="aurora" aria-hidden="true"></div>

  <div aria-hidden="true" style="position: absolute; inset: 0; display: flex;">
    <div class="glass" style="width: 240px; background: var(--surface); border-right: 1px solid var(--line);"></div>
    <div style="flex-grow: 1; padding: 100px 32px 32px; display: flex; flex-direction: column; gap: 24px;">
      <div style="width: 360px; height: 34px; border-radius: 8px; background: var(--raised);"></div>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px;">
        <div class="glass" style="height: 120px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line);"></div>
        <div class="glass" style="height: 120px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line);"></div>
        <div class="glass" style="height: 120px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line);"></div>
        <div class="glass" style="height: 120px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line);"></div>
        <div class="glass" style="height: 120px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line);"></div>
      </div>
      <div style="display: flex; gap: 16px;">
        <div class="glass" style="flex: 2; height: 420px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line);"></div>
        <div class="glass" style="flex: 1; height: 420px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line);"></div>
      </div>
    </div>
  </div>

  <div class="scrim" style="position: absolute; inset: 0; background: rgba(4,6,12,.55); display: flex; align-items: center; justify-content: center;">
    <div role="dialog" aria-modal="true" aria-labelledby="rf-title" class="glass" style="width: 520px; box-sizing: border-box; border-radius: 20px; background: var(--surface-strong); border: 1px solid var(--line-strong); box-shadow: var(--glass-hi), 0 30px 80px rgba(0,0,0,.55); display: flex; flex-direction: column;">
      <div style="display: flex; align-items: flex-start; gap: 14px; padding: 24px 24px 0;">
        <span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; background: var(--primary-soft); color: var(--primary-text); display: inline-flex; align-items: center; justify-content: center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"></path></svg>
        </span>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--cyan-text);">Season FY 2083/84</span>
          <h2 id="rf-title" style="margin: 0; font-family: var(--f-display); font-size: 22px; font-weight: 700; color: var(--text-1);">Record a fine</h2>
        </div>
        <button class="btn-i" aria-label="Close" style="width: 36px; height: 36px; border: 0; border-radius: 9px; background: transparent; color: var(--text-3); display: inline-flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
        </button>
      </div>

      <form style="display: flex; flex-direction: column; gap: 18px; padding: 22px 24px;">
        <label style="display: flex; flex-direction: column; gap: 6px;">
          <span style="font-size: 13px; font-weight: 600; color: var(--text-2);">Employee</span>
          <select style="height: 44px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--raised); color: var(--text-1); font-size: 15px;">
            <option>Rohan KC</option>
            <option>Aarav Shrestha</option>
            <option>Sita Gurung</option>
          </select>
        </label>
        <div style="display: flex; gap: 12px;">
          <label style="flex: 1 1 0; display: flex; flex-direction: column; gap: 6px;">
            <span style="font-size: 13px; font-weight: 600; color: var(--text-2);">Date</span>
            <input type="text" value="Oct 19, 2026" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--raised); color: var(--text-1); font-family: var(--f-mono); font-size: 14px;">
            <span style="font-family: var(--f-mono); font-size: 12px; color: var(--text-3);">3 Kartik 2083 BS</span>
          </label>
          <label style="flex: 1 1 0; display: flex; flex-direction: column; gap: 6px;">
            <span style="font-size: 13px; font-weight: 600; color: var(--text-2);">Amount (Rs.)</span>
            <input type="text" value="200" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--cyan); border-radius: 10px; background: var(--raised); color: var(--text-1); font-family: var(--f-mono); font-size: 14px; box-shadow: 0 0 0 3px rgba(45,212,239,.15);">
            <span style="font-size: 12px; color: var(--text-3);">Default from attendance settings</span>
          </label>
        </div>
        <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 6px;">
          <legend style="padding: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--text-2);">Status</legend>
          <div style="display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--raised);">
            <label style="flex: 1 1 0; height: 38px; border-radius: 9px; background: var(--pb-amber); color: var(--pf-amber); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;">
              <input type="radio" name="st" checked style="position: absolute; opacity: 0; width: 1px; height: 1px;">
              Unpaid
            </label>
            <label style="flex: 1 1 0; height: 38px; border-radius: 9px; color: var(--text-2); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;">
              <input type="radio" name="st" style="position: absolute; opacity: 0; width: 1px; height: 1px;">
              Paid
            </label>
          </div>
        </fieldset>
        <div role="alert" style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--pb-red); color: var(--pf-red); font-size: 13px; font-weight: 500;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM12 8v4M12 16h.01"></path></svg>
          Validation example: “Already fined for this day”
        </div>
      </form>

      <div style="display: flex; justify-content: flex-end; gap: 8px; padding: 16px 24px 22px; border-top: 1px solid var(--line);">
        <a class="btn-s" href="Main.dc.html" style="height: 40px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: 10px; color: var(--text-1); font-size: 14px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center;">Cancel</a>
        <button class="btn-p" style="height: 40px; padding: 0 18px; border: 0; border-radius: 10px; background: var(--primary); color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 6px 20px rgba(61,99,240,.35);">Record Fine</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"light":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const light = this.props.light ?? false;
    return { themeCls: light ? 'light' : '' };
  }
}
</script>
</body>
</html>
