<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile — More</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070A12}
a{color:#8EA6FF}a:hover{color:#B7C6FF}
.ht{--tab-bg:rgba(15,20,34,.9);--ink:#070A12;--surface:rgba(22,29,47,.55);--surface-solid:#121828;--surface-strong:rgba(22,29,47,.82);--raised:rgba(255,255,255,.05);--line:rgba(255,255,255,.09);--line-strong:rgba(255,255,255,.17);--text-1:#EDF1F8;--text-2:#B6BFCF;--text-3:#8E98AC;--primary:#3D63F0;--primary-hover:#5174FF;--primary-text:#8EA6FF;--primary-soft:rgba(61,99,240,.18);--cyan:#2DD4EF;--cyan-text:#67E3F5;--orange:#FF6A1F;--orange-hover:#FF8340;--orange-soft:rgba(255,106,31,.14);--unpaid:#F5A524;--glow:0 0 10px rgba(45,212,239,.7);--blur:blur(22px) saturate(160%);--glass-hi:inset 0 1px 0 rgba(255,255,255,.07);--shadow:0 8px 24px rgba(0,0,0,.28);--shadow-lift:0 16px 40px rgba(0,0,0,.45);--dots:rgba(255,255,255,.03);--pb-blue:rgba(61,99,240,.2);--pf-blue:#A5B8FF;--pb-green:rgba(34,197,94,.16);--pf-green:#6EE7A0;--pb-amber:rgba(245,165,36,.16);--pf-amber:#FCC560;--pb-red:rgba(244,63,94,.16);--pf-red:#FDA4B4;--pb-violet:rgba(167,139,250,.18);--pf-violet:#C4B5FD;--pb-cyan:rgba(45,212,239,.14);--pf-cyan:#67E3F5;--pb-gray:rgba(255,255,255,.07);--pf-gray:#B6BFCF;--f-display:'Space Grotesk',system-ui,sans-serif;--f-body:'IBM Plex Sans',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,monospace;position:relative;isolation:isolate;overflow:hidden;font-family:var(--f-body);color:var(--text-2);background-color:var(--ink);background-image:radial-gradient(var(--dots) 1px,transparent 1px);background-size:20px 20px;-webkit-font-smoothing:antialiased;color-scheme:dark}
.ht.light{--tab-bg:rgba(255,255,255,.88);--ink:#EDF1F8;--surface:rgba(255,255,255,.6);--surface-solid:#FFFFFF;--surface-strong:rgba(255,255,255,.86);--raised:rgba(255,255,255,.65);--line:rgba(14,21,37,.08);--line-strong:rgba(14,21,37,.16);--text-1:#0E1525;--text-2:#3B4558;--text-3:#5A6478;--primary-hover:#3254D6;--primary-text:#2F52D8;--primary-soft:rgba(61,99,240,.1);--cyan:#06B6D4;--cyan-text:#0E7490;--orange-soft:rgba(255,106,31,.1);--glow:0 0 8px rgba(6,182,212,.55);--glass-hi:inset 0 1px 0 rgba(255,255,255,.9);--shadow:0 8px 24px rgba(30,41,82,.08);--shadow-lift:0 16px 40px rgba(30,41,82,.14);--dots:rgba(14,21,37,.04);--pb-blue:rgba(61,99,240,.1);--pf-blue:#2F52D8;--pb-green:rgba(34,197,94,.12);--pf-green:#15803D;--pb-amber:rgba(245,165,36,.16);--pf-amber:#92400E;--pb-red:rgba(244,63,94,.1);--pf-red:#BE123C;--pb-violet:rgba(124,92,224,.1);--pf-violet:#6D28D9;--pb-cyan:rgba(6,182,212,.12);--pf-cyan:#0E7490;--pb-gray:rgba(14,21,37,.06);--pf-gray:#3B4558;color-scheme:light}
.ht .aurora{position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(360px 300px at 10% 4%,rgba(61,99,240,.38),transparent 70%),radial-gradient(320px 280px at 95% 22%,rgba(124,92,224,.28),transparent 70%),radial-gradient(360px 320px at 80% 70%,rgba(45,212,239,.16),transparent 70%),radial-gradient(300px 260px at 10% 92%,rgba(255,106,31,.12),transparent 70%)}
.ht.light .aurora{background:radial-gradient(360px 300px at 10% 4%,rgba(61,99,240,.22),transparent 70%),radial-gradient(320px 280px at 95% 22%,rgba(124,92,224,.16),transparent 70%),radial-gradient(360px 320px at 80% 70%,rgba(6,182,212,.14),transparent 70%),radial-gradient(300px 260px at 10% 92%,rgba(255,106,31,.1),transparent 70%)}
.ht .glass{-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--glass-hi),var(--shadow)}
.ht button,.ht input,.ht select,.ht textarea{font-family:inherit}
.ht select option{background:var(--surface-solid);color:var(--text-1)}
.ht :focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
</style>
</helmet>
<div class="ht {{themeCls}}" style="width: 390px; min-height: 1300px; box-sizing: border-box; padding: 0 0 110px;">
  <div class="aurora" aria-hidden="true"></div>

  <header style="padding: 56px 20px 16px; display: flex; flex-direction: column; gap: 4px;">
    <span style="font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--cyan-text);">Everything else</span>
    <h1 style="margin: 0; font-family: var(--f-display); font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; color: var(--text-1);">More</h1>
  </header>

  <main style="padding: 0 16px; display: flex; flex-direction: column; gap: 22px;">
    <section aria-label="Your profile" class="glass" style="display: flex; align-items: center; gap: 14px; padding: 18px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface);">
      <span aria-hidden="true" style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 9999px; background: var(--orange); color: #0A0E17; font-family: var(--f-display); font-size: 24px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(255,106,31,.35);">S</span>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
        <span style="font-family: var(--f-display); font-size: 20px; line-height: 1.2; font-weight: 700; color: var(--text-1);">Hi, Sanish</span>
        <span style="font-family: var(--f-mono); font-size: 12px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">sanish@heubert.com</span>
        <span style="align-self: flex-start; margin-top: 4px; height: 22px; padding: 0 8px; border-radius: 9999px; background: var(--pb-violet); color: var(--pf-violet); font-size: 12px; font-weight: 600; display: inline-flex; align-items: center;">Admin</span>
      </div>
      <a href="MobileSettings.dc.html" class="glass" aria-label="Settings" style="width: 44px; height: 44px; flex-shrink: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--raised); color: var(--text-2); display: inline-flex; align-items: center; justify-content: center; text-decoration: none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"></path></svg>
      </a>
    </section>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
      <section aria-label="{{g.title}}" style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 8px; padding: 0 4px;">
          <h2 style="margin: 0; font-family: var(--f-mono); font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3);">{{g.title}}</h2>
          <sc-if value="{{g.admin}}" hint-placeholder-val="{{false}}">
            <span style="height: 20px; padding: 0 7px; border-radius: 9999px; background: var(--pb-violet); color: var(--pf-violet); font-size: 12px; font-weight: 600; display: inline-flex; align-items: center;">Admins only</span>
          </sc-if>
        </div>
        <div class="glass" style="border: 1px solid var(--line); border-radius: 20px; background: var(--surface); overflow: hidden;">
          <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
            <a href="{{r.href}}" style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 16px; border-top: 1px solid {{r.divider}}; text-decoration: none;">
              <span aria-hidden="true" style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 11px; background: {{r.tileBg}}; color: {{r.tileFg}}; display: inline-flex; align-items: center; justify-content: center; box-shadow: {{r.tileShadow}};">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg>
              </span>
              <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; padding: 10px 0;">
                <span style="font-size: 15px; font-weight: 600; color: var(--text-1);">{{r.label}}</span>
                <span style="font-size: 13px; color: var(--text-3);">{{r.sub}}</span>
              </span>
              <sc-if value="{{r.hasBadge}}" hint-placeholder-val="{{false}}">
                <span style="height: 22px; padding: 0 8px; border-radius: 9999px; background: {{r.badgeBg}}; color: {{r.badgeFg}}; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; flex-shrink: 0;">{{r.badge}}</span>
              </sc-if>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; color: var(--text-3);"><path d="M9 18l6-6-6-6"></path></svg>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-for>

    <footer style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0 8px;">
      <span style="font-family: var(--f-mono); font-size: 12px; color: var(--text-3);">Heubert Tracker v1.0.0</span>
      <span style="font-family: var(--f-mono); font-size: 12px; color: var(--text-3);">Update channel · preview</span>
    </footer>
  </main>

  <div style="position: absolute; left: 0; right: 0; bottom: 0;">
    <dc-import name="MobileTabBar" active="more" hint-size="390px,86px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"light":{"editor":"boolean","default":false},"$preview":{"width":390,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const light = this.props.light ?? false;
    const I = {
      book: 'M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z',
      calendar: 'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01',
      cards: 'M9 3h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM3 7v12a2 2 0 0 0 2 2h10M13 8v6M10 11h6',
      columns: 'M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM9 3v18M15 3v18',
      meeting: 'M2 3h20M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3M7 21l5-5 5 5',
      cash: 'M4 6h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zM12 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM6 12h.01M18 12h.01',
      folder: 'M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2z',
      image: 'M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM9 7a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM21 15l-3.09-3.09a2 2 0 0 0-2.82 0L6 21',
      sliders: 'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6',
      gear: 'M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z'
    };
    const row = (label, sub, href, icon, tone, badge) => {
      const orange = tone === 'orange';
      return {
        label, sub, href, icon: I[icon],
        tileBg: orange ? 'var(--orange)' : 'var(--pb-' + tone + ')',
        tileFg: orange ? '#0A0E17' : 'var(--pf-' + tone + ')',
        tileShadow: orange ? '0 4px 14px rgba(255,106,31,.35)' : 'none',
        hasBadge: !!badge,
        badge: badge ? badge.text : '',
        badgeBg: badge ? badge.bg : 'transparent',
        badgeFg: badge ? badge.fg : 'inherit'
      };
    };
    const group = (title, rows, admin) => ({
      title, admin: !!admin,
      rows: rows.map((r, i) => Object.assign(r, { divider: i === 0 ? 'transparent' : 'var(--line)' }))
    });
    return {
      themeCls: light ? 'light' : '',
      groups: [
        group('Team', [
          row('Word of the Day', 'Today: Ephemeral', 'MobileWords.dc.html', 'book', 'blue'),
          row('Events', 'Birthdays, anniversaries, holidays', 'MobileEvents.dc.html', 'calendar', 'cyan'),
          row('Planning Poker', 'Estimate stories together', 'MobilePoker.dc.html', 'cards', 'violet', { text: '1 live', bg: 'var(--pb-cyan)', fg: 'var(--pf-cyan)' }),
          row('Retrospective', 'Sprint boards and action items', 'MobileRetro.dc.html', 'columns', 'green'),
          row('Meeting Mode', 'Daily standup at a glance', 'MobileMeeting.dc.html', 'meeting', 'orange')
        ]),
        group('Records', [
          row('Withdrawals', 'Spending from the fine fund', 'MobileWithdrawals.dc.html', 'cash', 'amber'),
          row('Projects', 'Active and archived projects', 'MobileProjects.dc.html', 'folder', 'blue'),
          row('Team Memories', 'Photos from team moments', 'MobileMemories.dc.html', 'image', 'violet')
        ]),
        group('Admin', [
          row('Leave Settings', 'Leave types and yearly quotas', 'MobileLeaveSettings.dc.html', 'sliders', 'gray')
        ], true),
        group('App', [
          row('Settings', 'Theme, notifications, account', 'MobileSettings.dc.html', 'gear', 'gray')
        ])
      ]
    };
  }
}
</script>
</body>
</html>
