<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile — Withdrawals</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070A12}
a{color:#8EA6FF}a:hover{color:#B7C6FF}
.ht{--tab-bg:rgba(15,20,34,.9);--ink:#070A12;--surface:rgba(22,29,47,.55);--surface-solid:#121828;--surface-strong:rgba(22,29,47,.82);--raised:rgba(255,255,255,.05);--line:rgba(255,255,255,.09);--line-strong:rgba(255,255,255,.17);--text-1:#EDF1F8;--text-2:#B6BFCF;--text-3:#8E98AC;--primary:#3D63F0;--primary-hover:#5174FF;--primary-text:#8EA6FF;--primary-soft:rgba(61,99,240,.18);--cyan:#2DD4EF;--cyan-text:#67E3F5;--orange:#FF6A1F;--orange-hover:#FF8340;--orange-soft:rgba(255,106,31,.14);--unpaid:#F5A524;--glow:0 0 10px rgba(45,212,239,.7);--blur:blur(22px) saturate(160%);--glass-hi:inset 0 1px 0 rgba(255,255,255,.07);--shadow:0 8px 24px rgba(0,0,0,.28);--shadow-lift:0 16px 40px rgba(0,0,0,.45);--dots:rgba(255,255,255,.03);--pb-blue:rgba(61,99,240,.2);--pf-blue:#A5B8FF;--pb-green:rgba(34,197,94,.16);--pf-green:#6EE7A0;--pb-amber:rgba(245,165,36,.16);--pf-amber:#FCC560;--pb-red:rgba(244,63,94,.16);--pf-red:#FDA4B4;--pb-violet:rgba(167,139,250,.18);--pf-violet:#C4B5FD;--pb-cyan:rgba(45,212,239,.14);--pf-cyan:#67E3F5;--pb-gray:rgba(255,255,255,.07);--pf-gray:#B6BFCF;--f-display:'Space Grotesk',system-ui,sans-serif;--f-body:'IBM Plex Sans',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,monospace;position:relative;isolation:isolate;overflow:hidden;font-family:var(--f-body);color:var(--text-2);background-color:var(--ink);background-image:radial-gradient(var(--dots) 1px,transparent 1px);background-size:20px 20px;-webkit-font-smoothing:antialiased;color-scheme:dark}
.ht.light{--tab-bg:rgba(255,255,255,.88);--ink:#EDF1F8;--surface:rgba(255,255,255,.6);--surface-solid:#FFFFFF;--surface-strong:rgba(255,255,255,.86);--raised:rgba(255,255,255,.65);--line:rgba(14,21,37,.08);--line-strong:rgba(14,21,37,.16);--text-1:#0E1525;--text-2:#3B4558;--text-3:#5A6478;--primary-hover:#3254D6;--primary-text:#2F52D8;--primary-soft:rgba(61,99,240,.1);--cyan:#06B6D4;--cyan-text:#0E7490;--orange-soft:rgba(255,106,31,.1);--glow:0 0 8px rgba(6,182,212,.55);--glass-hi:inset 0 1px 0 rgba(255,255,255,.9);--shadow:0 8px 24px rgba(30,41,82,.08);--shadow-lift:0 16px 40px rgba(30,41,82,.14);--dots:rgba(14,21,37,.04);--pb-blue:rgba(61,99,240,.1);--pf-blue:#2F52D8;--pb-green:rgba(34,197,94,.12);--pf-green:#15803D;--pb-amber:rgba(245,165,36,.16);--pf-amber:#92400E;--pb-red:rgba(244,63,94,.1);--pf-red:#BE123C;--pb-violet:rgba(124,92,224,.1);--pf-violet:#6D28D9;--pb-cyan:rgba(6,182,212,.12);--pf-cyan:#0E7490;--pb-gray:rgba(14,21,37,.06);--pf-gray:#3B4558;color-scheme:light}
.ht .aurora{position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(360px 300px at 10% 4%,rgba(61,99,240,.38),transparent 70%),radial-gradient(320px 280px at 95% 22%,rgba(124,92,224,.28),transparent 70%),radial-gradient(360px 320px at 80% 70%,rgba(45,212,239,.16),transparent 70%),radial-gradient(300px 260px at 10% 92%,rgba(255,106,31,.12),transparent 70%)}
.ht.light .aurora{background:radial-gradient(360px 300px at 10% 4%,rgba(61,99,240,.22),transparent 70%),radial-gradient(320px 280px at 95% 22%,rgba(124,92,224,.16),transparent 70%),radial-gradient(360px 320px at 80% 70%,rgba(6,182,212,.14),transparent 70%),radial-gradient(300px 260px at 10% 92%,rgba(255,106,31,.1),transparent 70%)}
.ht .glass{-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--glass-hi),var(--shadow)}
.ht button,.ht input,.ht select,.ht textarea{font-family:inherit}
.ht select option{background:var(--surface-solid);color:var(--text-1)}
.ht :focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
</style>
</helmet>
<div class="ht {{themeCls}}" style="width: 390px; min-height: 1000px; box-sizing: border-box; padding: 0 0 120px;">
  <div class="aurora" aria-hidden="true"></div>

  <header style="padding: 56px 16px 16px; display: flex; align-items: center; gap: 12px;">
    <a href="MobileFines.dc.html" aria-label="Back" class="glass" style="width: 44px; height: 44px; flex-shrink: 0; box-sizing: border-box; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--text-1); display: inline-flex; align-items: center; justify-content: center; text-decoration: none;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; flex-grow: 1; text-align: center; font-family: var(--f-display); font-size: 20px; font-weight: 700; color: var(--text-1);">Withdrawals</h1>
    <span style="width: 44px; flex-shrink: 0;" aria-hidden="true"></span>
  </header>

  <main style="padding: 0 16px; display: flex; flex-direction: column; gap: 14px;">
    <section class="glass" aria-labelledby="jar-title" style="padding: 18px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: var(--pb-violet); color: var(--pf-violet); display: inline-flex; align-items: center; justify-content: center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6h20v12H2zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM6 12h.01M18 12h.01"></path></svg>
        </span>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <h2 id="jar-title" style="margin: 0; font-family: var(--f-mono); font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--cyan-text);">Fine jar</h2>
          <span style="font-size: 13px; color: var(--text-3);">Paid fines minus withdrawals</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-family: var(--f-display); font-size: 38px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em; color: var(--text-1); font-variant-numeric: tabular-nums;">Rs. 600</span>
        <span style="font-size: 14px; color: var(--text-2);">left in the jar</span>
      </div>

      <div role="img" aria-label="Rs. 1,200 of Rs. 1,800 collected has been withdrawn" style="display: flex; height: 12px; border-radius: 9999px; background: var(--raised); border: 1px solid var(--line); overflow: hidden;">
        <div style="width: 66.7%; height: 100%; background: var(--primary); box-shadow: 0 0 12px rgba(61,99,240,.5);"></div>
        <div style="width: 33.3%; height: 100%; background: var(--cyan); opacity: .55;"></div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
        <div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 12px; background: var(--raised); border: 1px solid var(--line);">
          <span style="font-family: var(--f-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-3);">Collected</span>
          <span style="font-family: var(--f-mono); font-size: 15px; font-weight: 500; color: var(--text-1);">Rs. 1,800</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 12px; background: var(--raised); border: 1px solid var(--line);">
          <span style="display: flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-3);"><span style="width: 7px; height: 7px; border-radius: 2px; background: var(--primary);" aria-hidden="true"></span>Out</span>
          <span style="font-family: var(--f-mono); font-size: 15px; font-weight: 500; color: var(--text-1);">Rs. 1,200</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 12px; background: var(--raised); border: 1px solid var(--line);">
          <span style="display: flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-3);"><span style="width: 7px; height: 7px; border-radius: 2px; background: var(--cyan);" aria-hidden="true"></span>Left</span>
          <span style="font-family: var(--f-mono); font-size: 15px; font-weight: 500; color: var(--text-1);">Rs. 600</span>
        </div>
      </div>
    </section>

    <section class="glass" aria-labelledby="log-title" style="padding: 16px 18px 6px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); display: flex; flex-direction: column;">
      <div style="display: flex; align-items: baseline; gap: 8px; padding-bottom: 10px;">
        <h2 id="log-title" style="margin: 0; flex-grow: 1; font-family: var(--f-display); font-size: 17px; font-weight: 700; color: var(--text-1);">History</h2>
        <span style="font-family: var(--f-mono); font-size: 12px; color: var(--text-3);">Rs. 1,200 · 3 records</span>
      </div>
      <sc-for list="{{withdrawals}}" as="w" hint-placeholder-count="3">
        <div style="display: flex; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line);">
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px;">
            <div style="display: flex; align-items: baseline; gap: 8px;">
              <span style="flex-grow: 1; font-family: var(--f-mono); font-size: 17px; font-weight: 500; color: var(--text-1);">{{w.amount}}</span>
              <span style="font-family: var(--f-mono); font-size: 12px; color: var(--text-3);">{{w.date}}</span>
            </div>
            <span style="font-size: 14px; line-height: 1.45; color: var(--text-2);">{{w.reason}}</span>
            <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-3);">
              <span style="width: 22px; height: 22px; border-radius: 9999px; background: {{w.av}}; color: {{w.avFg}}; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center;" aria-hidden="true">{{w.initials}}</span>
              Withdrawn by {{w.by}}
            </span>
          </div>
          <button aria-label="{{w.deleteLabel}}" style="width: 44px; height: 44px; flex-shrink: 0; margin-right: -8px; border: 0; border-radius: 12px; background: transparent; color: var(--text-3); display: inline-flex; align-items: center; justify-content: center; cursor: pointer;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"></path></svg>
          </button>
        </div>
      </sc-for>
    </section>
  </main>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 16px 34px; background: linear-gradient(to top, var(--ink) 55%, transparent);">
    <button style="width: 100%; height: 52px; border: 0; border-radius: 14px; background: var(--primary); color: #FFFFFF; font-size: 16px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 10px 28px rgba(61,99,240,.45); cursor: pointer;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg>
      Withdraw
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"light":{"editor":"boolean","default":false},"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const light = this.props.light ?? false;
    const rows = [
      ['Rs. 600', 'Oct 9, 2026', 'Team lunch after the sprint 41 demo', 'Sanish', 'S', '#FF6A1F', '#0A0E17'],
      ['Rs. 400', 'Sep 18, 2026', 'Dashain decorations and tika supplies for the office', 'Sanish', 'S', '#FF6A1F', '#0A0E17'],
      ['Rs. 200', 'Aug 21, 2026', 'Snacks for the Friday retrospective', '[ADMIN NAME]', 'A', '#7C5CE0', '#FFFFFF']
    ];
    return {
      themeCls: light ? 'light' : '',
      withdrawals: rows.map(([amount, date, reason, by, initials, av, avFg]) => ({
        amount, date, reason, by, initials, av, avFg,
        deleteLabel: 'Delete withdrawal of ' + amount + ' on ' + date
      }))
    };
  }
}
</script>
</body>
</html>
