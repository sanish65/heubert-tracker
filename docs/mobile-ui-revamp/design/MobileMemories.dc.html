<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile — Team Memories</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070A12}
a{color:#8EA6FF}a:hover{color:#B7C6FF}
.ht{--tab-bg:rgba(15,20,34,.9);--ink:#070A12;--surface:rgba(22,29,47,.55);--surface-solid:#121828;--surface-strong:rgba(22,29,47,.82);--raised:rgba(255,255,255,.05);--line:rgba(255,255,255,.09);--line-strong:rgba(255,255,255,.17);--text-1:#EDF1F8;--text-2:#B6BFCF;--text-3:#8E98AC;--primary:#3D63F0;--primary-hover:#5174FF;--primary-text:#8EA6FF;--primary-soft:rgba(61,99,240,.18);--cyan:#2DD4EF;--cyan-text:#67E3F5;--orange:#FF6A1F;--orange-hover:#FF8340;--orange-soft:rgba(255,106,31,.14);--unpaid:#F5A524;--glow:0 0 10px rgba(45,212,239,.7);--blur:blur(22px) saturate(160%);--glass-hi:inset 0 1px 0 rgba(255,255,255,.07);--shadow:0 8px 24px rgba(0,0,0,.28);--shadow-lift:0 16px 40px rgba(0,0,0,.45);--dots:rgba(255,255,255,.03);--pb-blue:rgba(61,99,240,.2);--pf-blue:#A5B8FF;--pb-green:rgba(34,197,94,.16);--pf-green:#6EE7A0;--pb-amber:rgba(245,165,36,.16);--pf-amber:#FCC560;--pb-red:rgba(244,63,94,.16);--pf-red:#FDA4B4;--pb-violet:rgba(167,139,250,.18);--pf-violet:#C4B5FD;--pb-cyan:rgba(45,212,239,.14);--pf-cyan:#67E3F5;--pb-gray:rgba(255,255,255,.07);--pf-gray:#B6BFCF;--f-display:'Space Grotesk',system-ui,sans-serif;--f-body:'IBM Plex Sans',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,monospace;position:relative;isolation:isolate;overflow:hidden;font-family:var(--f-body);color:var(--text-2);background-color:var(--ink);background-image:radial-gradient(var(--dots) 1px,transparent 1px);background-size:20px 20px;-webkit-font-smoothing:antialiased;color-scheme:dark}
.ht.light{--tab-bg:rgba(255,255,255,.88);--ink:#EDF1F8;--surface:rgba(255,255,255,.6);--surface-solid:#FFFFFF;--surface-strong:rgba(255,255,255,.86);--raised:rgba(255,255,255,.65);--line:rgba(14,21,37,.08);--line-strong:rgba(14,21,37,.16);--text-1:#0E1525;--text-2:#3B4558;--text-3:#5A6478;--primary-hover:#3254D6;--primary-text:#2F52D8;--primary-soft:rgba(61,99,240,.1);--cyan:#06B6D4;--cyan-text:#0E7490;--orange-soft:rgba(255,106,31,.1);--glow:0 0 8px rgba(6,182,212,.55);--glass-hi:inset 0 1px 0 rgba(255,255,255,.9);--shadow:0 8px 24px rgba(30,41,82,.08);--shadow-lift:0 16px 40px rgba(30,41,82,.14);--dots:rgba(14,21,37,.04);--pb-blue:rgba(61,99,240,.1);--pf-blue:#2F52D8;--pb-green:rgba(34,197,94,.12);--pf-green:#15803D;--pb-amber:rgba(245,165,36,.16);--pf-amber:#92400E;--pb-red:rgba(244,63,94,.1);--pf-red:#BE123C;--pb-violet:rgba(124,92,224,.1);--pf-violet:#6D28D9;--pb-cyan:rgba(6,182,212,.12);--pf-cyan:#0E7490;--pb-gray:rgba(14,21,37,.06);--pf-gray:#3B4558;color-scheme:light}
.ht .aurora{position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(360px 300px at 10% 4%,rgba(61,99,240,.38),transparent 70%),radial-gradient(320px 280px at 95% 22%,rgba(124,92,224,.28),transparent 70%),radial-gradient(360px 320px at 80% 70%,rgba(45,212,239,.16),transparent 70%),radial-gradient(300px 260px at 10% 92%,rgba(255,106,31,.12),transparent 70%)}
.ht.light .aurora{background:radial-gradient(360px 300px at 10% 4%,rgba(61,99,240,.22),transparent 70%),radial-gradient(320px 280px at 95% 22%,rgba(124,92,224,.16),transparent 70%),radial-gradient(360px 320px at 80% 70%,rgba(6,182,212,.14),transparent 70%),radial-gradient(300px 260px at 10% 92%,rgba(255,106,31,.1),transparent 70%)}
.ht .glass{-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--glass-hi),var(--shadow)}
.ht button,.ht input,.ht select,.ht textarea{font-family:inherit}
.ht select option{background:var(--surface-solid);color:var(--text-1)}
.ht :focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
</style>
</helmet>
<div class="ht {{themeCls}}" style="width: 390px; min-height: 1960px; box-sizing: border-box; padding: 0 0 110px;">
  <div class="aurora" aria-hidden="true"></div>

  <header style="padding: 56px 16px 14px; display: flex; align-items: center; gap: 12px;">
    <a href="MobileMore.dc.html" aria-label="Back" class="glass" style="width: 44px; height: 44px; flex-shrink: 0; box-sizing: border-box; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--text-1); display: inline-flex; align-items: center; justify-content: center; text-decoration: none;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column;">
      <h1 style="margin: 0; font-family: var(--f-display); font-size: 20px; font-weight: 700; letter-spacing: -0.01em; color: var(--text-1);">Team Memories</h1>
      <span style="font-family: var(--f-mono); font-size: 12px; color: var(--text-3);">12 pinned by the team</span>
    </div>
  </header>

  <nav aria-label="Filter memories" style="display: flex; gap: 8px; padding: 0 16px 14px; overflow-x: auto; white-space: nowrap;">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
      <button aria-pressed="{{f.pressed}}" style="flex-shrink: 0; height: 44px; padding: 0 14px; border: 1px solid {{f.border}}; border-radius: 9999px; background: {{f.bg}}; color: {{f.fg}}; font-size: 14px; font-weight: {{f.weight}}; display: inline-flex; align-items: center; gap: 7px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{f.icon}}"></path></svg>
        {{f.label}}
        <span style="font-family: var(--f-mono); font-size: 12px; color: var(--text-3);">{{f.count}}</span>
      </button>
    </sc-for>
  </nav>

  <main style="padding: 0 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: start;">
    <sc-for list="{{columns}}" as="col" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 12px; min-width: 0;">
        <sc-for list="{{col.items}}" as="m" hint-placeholder-count="5">
          <article class="glass" style="border: 1px solid var(--line); border-radius: 18px; background: var(--surface); overflow: hidden; display: flex; flex-direction: column;">
            <sc-if value="{{m.isImage}}" hint-placeholder-val="{{true}}">
              <div role="img" aria-label="{{m.placeholder}}" style="height: {{m.h}}; box-sizing: border-box; padding: 0 14px; background: var(--raised); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; color: var(--text-3);">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg>
                <span style="font-family: var(--f-mono); font-size: 12px; line-height: 1.45;">{{m.placeholder}}</span>
              </div>
            </sc-if>
            <sc-if value="{{m.isVideo}}" hint-placeholder-val="{{false}}">
              <div role="img" aria-label="{{m.placeholder}}" style="position: relative; height: {{m.h}}; box-sizing: border-box; padding: 0 14px; background: var(--raised); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; color: var(--text-3);">
                <span style="width: 46px; height: 46px; border-radius: 9999px; background: var(--surface-strong); border: 1px solid var(--line-strong); color: var(--text-1); display: inline-flex; align-items: center; justify-content: center;">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="m7 4 13 8-13 8z"></path></svg>
                </span>
                <span style="font-family: var(--f-mono); font-size: 12px; line-height: 1.45;">{{m.placeholder}}</span>
                <span style="position: absolute; top: 10px; left: 10px; height: 22px; padding: 0 8px; border-radius: 9999px; background: var(--pb-violet); color: var(--pf-violet); font-size: 12px; font-weight: 600; display: inline-flex; align-items: center;">Video</span>
              </div>
            </sc-if>
            <sc-if value="{{m.isText}}" hint-placeholder-val="{{false}}">
              <div style="padding: 14px 14px 4px; display: flex; flex-direction: column; gap: 8px;">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--cyan-text);"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1zM15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"></path></svg>
                <p style="margin: 0; font-family: var(--f-display); font-size: 15px; line-height: 1.45; font-weight: 500; color: var(--text-1);">{{m.message}}</p>
              </div>
            </sc-if>
            <div style="padding: 10px 12px 10px; display: flex; flex-direction: column; gap: 8px;">
              <span style="font-size: 14px; font-weight: 600; line-height: 1.35; color: var(--text-1);">{{m.caption}}</span>
              <div style="display: flex; align-items: center; gap: 8px; min-height: 44px;">
                <span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 9999px; background: {{m.av}}; color: {{m.avFg}}; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center;">{{m.initials}}</span>
                <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column;">
                  <span style="font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{m.author}}</span>
                  <span style="font-family: var(--f-mono); font-size: 12px; color: var(--text-3);">{{m.date}}</span>
                </div>
                <sc-if value="{{m.isMine}}" hint-placeholder-val="{{false}}">
                  <button aria-label="{{m.actionsLabel}}" style="width: 44px; height: 44px; flex-shrink: 0; margin-right: -8px; border: 0; border-radius: 12px; background: transparent; color: var(--text-2); display: inline-flex; align-items: center; justify-content: center;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
                  </button>
                </sc-if>
              </div>
            </div>
          </article>
        </sc-for>
      </div>
    </sc-for>
  </main>

  <button aria-label="Add Memory" style="position: absolute; right: 16px; bottom: 28px; width: 56px; height: 56px; border: 0; border-radius: 9999px; background: var(--primary); color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 10px 28px rgba(61,99,240,.45);">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"light":{"editor":"boolean","default":false},"$preview":{"width":390,"height":1960}}'>
class Component extends DCLogic {
  renderVals() {
    const light = this.props.light ?? false;
    const ppl = {
      AS: ['Aarav Shrestha', '#3D63F0'], SG: ['Sita Gurung', '#7C5CE0'], BT: ['Bikash Thapa', '#0B7F90'],
      PM: ['Priya Maharjan', '#B4471A'], RK: ['Rohan KC', '#3D63F0'], KJ: ['Kriti Joshi', '#7C5CE0'],
      NT: ['Nabin Tamang', '#0B7F90'], AR: ['Anisha Rai', '#B4471A'], S: ['Sanish', '#FF6A1F']
    };
    const mem = (type, who, caption, date, extra, h) => ({
      isImage: type === 'image', isVideo: type === 'video', isText: type === 'text',
      placeholder: type === 'text' ? '' : extra, message: type === 'text' ? extra : '',
      h: h || '200px', caption, date,
      author: ppl[who][0], av: ppl[who][1], avFg: who === 'S' ? '#0A0E17' : '#FFFFFF',
      initials: who, isMine: who === 'S', actionsLabel: 'Edit or delete “' + caption + '”'
    });
    const filter = (label, count, on, icon) => ({
      label, count, icon, pressed: on ? 'true' : 'false',
      bg: on ? 'var(--primary-soft)' : 'var(--surface)',
      border: on ? 'var(--primary)' : 'var(--line-strong)',
      fg: on ? 'var(--text-1)' : 'var(--text-2)',
      weight: on ? '600' : '500'
    });
    return {
      themeCls: light ? 'light' : '',
      filters: [
        filter('All', '12', true, 'M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z'),
        filter('Photos', '8', false, 'M3 5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM21 15l-5-5L5 21'),
        filter('Videos', '2', false, 'm16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5M4 6h10a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z'),
        filter('Messages', '2', false, 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z')
      ],
      columns: [
        { items: [
          mem('image', 'S', 'Anisha’s birthday cake', 'Oct 19, 2026', '[Photo — Anisha’s birthday 2026]', '190px'),
          mem('text', 'KJ', 'Standup streak', 'Oct 16, 2026', 'Rohan joined standup on time three days running. Pinning it here as proof.'),
          mem('image', 'NT', 'Deusi night', 'Nov 2, 2025', '[Team photo — Tihar deusi 2025]', '250px'),
          mem('video', 'AS', '[Offsite clip caption]', 'Mar 14, 2026', '[Video — team offsite 2026]', '180px'),
          mem('image', 'KJ', 'First day at the new desk', 'Jan 8, 2025', '[Photo — Kriti’s first day 2025]', '170px')
        ] },
        { items: [
          mem('image', 'SG', 'Dashain lunch at the office', 'Oct 10, 2025', '[Team photo — Dashain lunch 2025]', '230px'),
          mem('text', 'BT', 'Retro wisdom', 'Sep 22, 2026', 'Best retro card this sprint: “Ship the small thing first.”'),
          mem('image', 'PM', 'Tika day', 'Oct 3, 2025', '[Team photo — Dashain tika 2025]', '210px'),
          mem('video', 'S', 'Laxmi Puja lights', 'Nov 1, 2024', '[Video — Tihar lights 2024]', '190px'),
          mem('image', 'AR', 'Nabin’s cake-cutting', 'Oct 25, 2024', '[Photo — Nabin’s work anniversary 2024]', '200px')
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
