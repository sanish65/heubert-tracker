<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile — Record Leave</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070A12}
a{color:#8EA6FF}a:hover{color:#B7C6FF}
.ht{--tab-bg:rgba(15,20,34,.9);--ink:#070A12;--surface:rgba(22,29,47,.55);--surface-solid:#121828;--surface-strong:rgba(22,29,47,.82);--raised:rgba(255,255,255,.05);--line:rgba(255,255,255,.09);--line-strong:rgba(255,255,255,.17);--text-1:#EDF1F8;--text-2:#B6BFCF;--text-3:#8E98AC;--primary:#3D63F0;--primary-hover:#5174FF;--primary-text:#8EA6FF;--primary-soft:rgba(61,99,240,.18);--cyan:#2DD4EF;--cyan-text:#67E3F5;--orange:#FF6A1F;--orange-hover:#FF8340;--orange-soft:rgba(255,106,31,.14);--unpaid:#F5A524;--glow:0 0 10px rgba(45,212,239,.7);--blur:blur(22px) saturate(160%);--glass-hi:inset 0 1px 0 rgba(255,255,255,.07);--shadow:0 8px 24px rgba(0,0,0,.28);--shadow-lift:0 16px 40px rgba(0,0,0,.45);--dots:rgba(255,255,255,.03);--pb-blue:rgba(61,99,240,.2);--pf-blue:#A5B8FF;--pb-green:rgba(34,197,94,.16);--pf-green:#6EE7A0;--pb-amber:rgba(245,165,36,.16);--pf-amber:#FCC560;--pb-red:rgba(244,63,94,.16);--pf-red:#FDA4B4;--pb-violet:rgba(167,139,250,.18);--pf-violet:#C4B5FD;--pb-cyan:rgba(45,212,239,.14);--pf-cyan:#67E3F5;--pb-gray:rgba(255,255,255,.07);--pf-gray:#B6BFCF;--f-display:'Space Grotesk',system-ui,sans-serif;--f-body:'IBM Plex Sans',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,monospace;position:relative;isolation:isolate;overflow:hidden;font-family:var(--f-body);color:var(--text-2);background-color:var(--ink);background-image:radial-gradient(var(--dots) 1px,transparent 1px);background-size:20px 20px;-webkit-font-smoothing:antialiased;color-scheme:dark}
.ht.light{--tab-bg:rgba(255,255,255,.88);--ink:#EDF1F8;--surface:rgba(255,255,255,.6);--surface-solid:#FFFFFF;--surface-strong:rgba(255,255,255,.86);--raised:rgba(255,255,255,.65);--line:rgba(14,21,37,.08);--line-strong:rgba(14,21,37,.16);--text-1:#0E1525;--text-2:#3B4558;--text-3:#5A6478;--primary-hover:#3254D6;--primary-text:#2F52D8;--primary-soft:rgba(61,99,240,.1);--cyan:#06B6D4;--cyan-text:#0E7490;--orange-soft:rgba(255,106,31,.1);--glow:0 0 8px rgba(6,182,212,.55);--glass-hi:inset 0 1px 0 rgba(255,255,255,.9);--shadow:0 8px 24px rgba(30,41,82,.08);--shadow-lift:0 16px 40px rgba(30,41,82,.14);--dots:rgba(14,21,37,.04);--pb-blue:rgba(61,99,240,.1);--pf-blue:#2F52D8;--pb-green:rgba(34,197,94,.12);--pf-green:#15803D;--pb-amber:rgba(245,165,36,.16);--pf-amber:#92400E;--pb-red:rgba(244,63,94,.1);--pf-red:#BE123C;--pb-violet:rgba(124,92,224,.1);--pf-violet:#6D28D9;--pb-cyan:rgba(6,182,212,.12);--pf-cyan:#0E7490;--pb-gray:rgba(14,21,37,.06);--pf-gray:#3B4558;color-scheme:light}
.ht .aurora{position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(360px 300px at 10% 4%,rgba(61,99,240,.38),transparent 70%),radial-gradient(320px 280px at 95% 22%,rgba(124,92,224,.28),transparent 70%),radial-gradient(360px 320px at 80% 70%,rgba(45,212,239,.16),transparent 70%),radial-gradient(300px 260px at 10% 92%,rgba(255,106,31,.12),transparent 70%)}
.ht.light .aurora{background:radial-gradient(360px 300px at 10% 4%,rgba(61,99,240,.22),transparent 70%),radial-gradient(320px 280px at 95% 22%,rgba(124,92,224,.16),transparent 70%),radial-gradient(360px 320px at 80% 70%,rgba(6,182,212,.14),transparent 70%),radial-gradient(300px 260px at 10% 92%,rgba(255,106,31,.1),transparent 70%)}
.ht .glass{-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--glass-hi),var(--shadow)}
.ht button,.ht input,.ht select,.ht textarea{font-family:inherit}
.ht select option{background:var(--surface-solid);color:var(--text-1)}
.ht :focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
</style>
</helmet>
<div class="ht {{themeCls}}" style="width: 390px; height: 844px; box-sizing: border-box; padding: 0;">
  <div class="aurora" aria-hidden="true"></div>

  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 56px 16px 0; display: flex; flex-direction: column; gap: 14px;">
    <div style="padding: 0 4px; display: flex; align-items: flex-end; gap: 12px;">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 10px;">
        <span style="width: 170px; height: 10px; border-radius: 9999px; background: var(--cyan); opacity: .45;"></span>
        <span style="width: 110px; height: 24px; border-radius: 8px; background: var(--text-1); opacity: .5;"></span>
      </div>
      <span class="glass" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);"></span>
      <span style="width: 44px; height: 44px; border-radius: 9999px; background: var(--orange); opacity: .8;"></span>
    </div>
    <div style="display: flex; gap: 8px;">
      <span style="width: 120px; height: 44px; border-radius: 9999px; background: var(--primary); opacity: .8;"></span>
      <span class="glass" style="width: 110px; height: 44px; border-radius: 9999px; border: 1px solid var(--line); background: var(--surface);"></span>
      <span class="glass" style="width: 150px; height: 44px; border-radius: 9999px; border: 1px solid var(--line); background: var(--surface);"></span>
    </div>
    <div class="glass" style="height: 430px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); padding: 14px; box-sizing: border-box; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: 54px; gap: 4px; align-content: end;">
      <span style="border-radius: 10px; background: var(--raised);"></span><span style="border-radius: 10px; background: var(--raised);"></span><span style="border-radius: 10px; background: var(--raised);"></span><span style="border-radius: 10px; background: var(--raised);"></span><span style="border-radius: 10px; background: var(--raised);"></span><span style="border-radius: 10px; background: var(--raised);"></span><span style="border-radius: 10px; background: var(--raised);"></span>
      <span style="border-radius: 10px; background: var(--raised);"></span><span style="border-radius: 10px; background: var(--raised);"></span><span style="border-radius: 10px; background: var(--raised);"></span><span style="border-radius: 10px; background: var(--raised);"></span><span style="border-radius: 10px; background: var(--raised);"></span><span style="border-radius: 10px; background: var(--raised);"></span><span style="border-radius: 10px; background: var(--raised);"></span>
      <span style="border-radius: 10px; background: var(--raised);"></span><span style="border-radius: 10px; background: var(--raised);"></span><span style="border-radius: 10px; background: var(--orange-soft);"></span><span style="border-radius: 10px; background: var(--orange-soft);"></span><span style="border-radius: 10px; background: var(--orange-soft);"></span><span style="border-radius: 10px; background: var(--orange-soft);"></span><span style="border-radius: 10px; background: var(--orange-soft);"></span>
    </div>
    <div class="glass" style="height: 200px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface);"></div>
    <span style="position: absolute; left: 0; right: 0; bottom: 0; height: 86px; background: var(--tab-bg); border-top: 1px solid var(--line);"></span>
  </div>

  <a href="MobileLeaves.dc.html" aria-label="Close and return to Leaves" style="position: absolute; inset: 0; background: rgba(4,6,12,.55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);"></a>

  <section role="dialog" aria-modal="true" aria-labelledby="rl-title" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 8px 20px 28px; border-radius: 24px 24px 0 0; border-top: 1px solid var(--line-strong); background: var(--surface-solid); box-shadow: 0 -16px 48px rgba(0,0,0,.45); display: flex; flex-direction: column; gap: 12px;">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 9999px; background: var(--line-strong);"></span>

    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
        <h2 id="rl-title" style="margin: 0; font-family: var(--f-display); font-size: 22px; font-weight: 700; letter-spacing: -0.01em; color: var(--text-1);">Record leave</h2>
        <span style="font-family: var(--f-mono); font-size: 12px; color: var(--text-3);">Season · FY 2083/84</span>
      </div>
      <a href="MobileLeaves.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 9999px; background: var(--raised); border: 1px solid var(--line); color: var(--text-2); display: inline-flex; align-items: center; justify-content: center; text-decoration: none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg>
      </a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="rl-emp" style="font-size: 13px; font-weight: 600; color: var(--text-2);">Employee</label>
      <div style="position: relative;">
        <span aria-hidden="true" style="position: absolute; left: 10px; top: 10px; width: 28px; height: 28px; border-radius: 9999px; background: var(--orange); color: #0A0E17; font-family: var(--f-display); font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;">S</span>
        <select id="rl-emp" style="width: 100%; height: 48px; padding: 0 40px 0 48px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--raised); color: var(--text-1); font-size: 15px; -webkit-appearance: none; appearance: none;">
          <option selected="selected">Sanish (you)</option>
          <option>Aarav Shrestha</option>
          <option>Anisha Rai</option>
          <option>Kriti Joshi</option>
          <option>Nabin Tamang</option>
          <option>Priya Maharjan</option>
          <option>Rohan KC</option>
          <option>Sita Gurung</option>
        </select>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 14px; top: 15px; pointer-events: none;"><path d="M6 9l6 6 6-6"></path></svg>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="rl-type" style="font-size: 13px; font-weight: 600; color: var(--text-2);">Leave type</label>
      <div style="position: relative;">
        <select id="rl-type" aria-describedby="rl-warn" style="width: 100%; height: 48px; padding: 0 40px 0 14px; border: 1px solid rgba(245,165,36,.55); border-radius: 12px; background: var(--raised); color: var(--text-1); font-size: 15px; -webkit-appearance: none; appearance: none;">
          <option>Casual · 7 left</option>
          <option selected="selected">Sick · 2 left</option>
          <option>Home · 4 left</option>
          <option>Unpaid · no limit</option>
        </select>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 14px; top: 15px; pointer-events: none;"><path d="M6 9l6 6 6-6"></path></svg>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span id="rl-dur" style="font-size: 13px; font-weight: 600; color: var(--text-2);">Duration</span>
      <div role="radiogroup" aria-labelledby="rl-dur" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 3px; border: 1px solid var(--line); border-radius: 12px; background: var(--raised);">
        <button role="radio" aria-checked="false" style="height: 44px; border: 0; border-radius: 9px; background: transparent; color: var(--text-2); font-size: 14px; font-weight: 500;">Full day</button>
        <button role="radio" aria-checked="true" style="height: 44px; border: 0; border-radius: 9px; background: var(--primary); color: #FFFFFF; font-size: 14px; font-weight: 600; box-shadow: 0 4px 12px rgba(61,99,240,.35);">Half day</button>
        <button role="radio" aria-checked="false" style="height: 44px; border: 0; border-radius: 9px; background: transparent; color: var(--text-2); font-size: 14px; font-weight: 500;">Early leave</button>
      </div>
      <div role="radiogroup" aria-label="Half day segment" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
        <button role="radio" aria-checked="true" style="height: 44px; border: 1px solid var(--primary); border-radius: 12px; background: var(--primary-soft); color: var(--text-1); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--primary-text)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v8M4.93 10.93l1.41 1.41M2 18h2M20 18h2M19.07 10.93l-1.41 1.41M22 22H2M8 6l4-4 4 4M16 18a4 4 0 0 0-8 0"></path></svg>
          First half
        </button>
        <button role="radio" aria-checked="false" style="height: 44px; border: 1px solid var(--line-strong); border-radius: 12px; background: transparent; color: var(--text-2); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 10V2M4.93 10.93l1.41 1.41M2 18h2M20 18h2M19.07 10.93l-1.41 1.41M22 22H2M16 6l-4 4-4-4M16 18a4 4 0 0 0-8 0"></path></svg>
          Second half
        </button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <span id="rl-from" style="font-size: 13px; font-weight: 600; color: var(--text-2);">From</span>
          <button aria-labelledby="rl-from rl-from-v" style="height: 58px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--raised); display: flex; align-items: center; gap: 10px; text-align: left;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path></svg>
            <span id="rl-from-v" style="display: flex; flex-direction: column; gap: 1px;">
              <span style="font-size: 15px; font-weight: 600; color: var(--text-1);">Mon, Oct 26</span>
              <span style="font-family: var(--f-mono); font-size: 12px; color: var(--text-3);">10 Kartik 2083</span>
            </span>
          </button>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <span id="rl-to" style="font-size: 13px; font-weight: 600; color: var(--text-2);">To</span>
          <button aria-labelledby="rl-to rl-to-v" style="height: 58px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--raised); display: flex; align-items: center; gap: 10px; text-align: left;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path></svg>
            <span id="rl-to-v" style="display: flex; flex-direction: column; gap: 1px;">
              <span style="font-size: 15px; font-weight: 600; color: var(--text-1);">Fri, Oct 30</span>
              <span style="font-family: var(--f-mono); font-size: 12px; color: var(--text-3);">14 Kartik 2083</span>
            </span>
          </button>
        </div>
      </div>
      <span style="font-family: var(--f-mono); font-size: 12px; color: var(--cyan-text);">2.5 working days · weekends &amp; holidays skipped</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="rl-reason" style="font-size: 13px; font-weight: 600; color: var(--text-2);">Reason <span style="font-weight: 400; color: var(--text-3);">(optional)</span></label>
      <textarea id="rl-reason" rows="2" placeholder="e.g. Doctor appointment" style="height: 64px; box-sizing: border-box; padding: 10px 14px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--raised); color: var(--text-1); font-size: 15px; resize: none;"></textarea>
    </div>

    <div id="rl-warn" role="alert" style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--pb-amber); border: 1px solid rgba(245,165,36,.4);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--pf-amber)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px;"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01"></path></svg>
      <span style="font-size: 13px; line-height: 1.4; color: var(--text-1);"><strong style="color: var(--pf-amber);">Not enough Sick leave.</strong> 2.5 days requested, 2 left. Consider Unpaid Leave instead.</span>
    </div>

    <button style="height: 52px; margin-top: 4px; border: 0; border-radius: 14px; background: var(--primary); color: #FFFFFF; font-size: 16px; font-weight: 600; box-shadow: 0 8px 24px rgba(61,99,240,.4);">Save Leave</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"light":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const light = this.props.light ?? false;
    return { themeCls: light ? 'light' : '' };
  }
}
</script>
</body>
</html>
