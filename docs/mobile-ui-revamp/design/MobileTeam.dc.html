<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile — Team</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070A12}
a{color:#8EA6FF}a:hover{color:#B7C6FF}
.ht{--tab-bg:rgba(15,20,34,.9);--ink:#070A12;--surface:rgba(22,29,47,.55);--surface-solid:#121828;--surface-strong:rgba(22,29,47,.82);--raised:rgba(255,255,255,.05);--line:rgba(255,255,255,.09);--line-strong:rgba(255,255,255,.17);--text-1:#EDF1F8;--text-2:#B6BFCF;--text-3:#8E98AC;--primary:#3D63F0;--primary-hover:#5174FF;--primary-text:#8EA6FF;--primary-soft:rgba(61,99,240,.18);--cyan:#2DD4EF;--cyan-text:#67E3F5;--orange:#FF6A1F;--orange-hover:#FF8340;--orange-soft:rgba(255,106,31,.14);--unpaid:#F5A524;--glow:0 0 10px rgba(45,212,239,.7);--blur:blur(22px) saturate(160%);--glass-hi:inset 0 1px 0 rgba(255,255,255,.07);--shadow:0 8px 24px rgba(0,0,0,.28);--shadow-lift:0 16px 40px rgba(0,0,0,.45);--dots:rgba(255,255,255,.03);--pb-blue:rgba(61,99,240,.2);--pf-blue:#A5B8FF;--pb-green:rgba(34,197,94,.16);--pf-green:#6EE7A0;--pb-amber:rgba(245,165,36,.16);--pf-amber:#FCC560;--pb-red:rgba(244,63,94,.16);--pf-red:#FDA4B4;--pb-violet:rgba(167,139,250,.18);--pf-violet:#C4B5FD;--pb-cyan:rgba(45,212,239,.14);--pf-cyan:#67E3F5;--pb-gray:rgba(255,255,255,.07);--pf-gray:#B6BFCF;--f-display:'Space Grotesk',system-ui,sans-serif;--f-body:'IBM Plex Sans',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,monospace;position:relative;isolation:isolate;overflow:hidden;font-family:var(--f-body);color:var(--text-2);background-color:var(--ink);background-image:radial-gradient(var(--dots) 1px,transparent 1px);background-size:20px 20px;-webkit-font-smoothing:antialiased;color-scheme:dark}
.ht.light{--tab-bg:rgba(255,255,255,.88);--ink:#EDF1F8;--surface:rgba(255,255,255,.6);--surface-solid:#FFFFFF;--surface-strong:rgba(255,255,255,.86);--raised:rgba(255,255,255,.65);--line:rgba(14,21,37,.08);--line-strong:rgba(14,21,37,.16);--text-1:#0E1525;--text-2:#3B4558;--text-3:#5A6478;--primary-hover:#3254D6;--primary-text:#2F52D8;--primary-soft:rgba(61,99,240,.1);--cyan:#06B6D4;--cyan-text:#0E7490;--orange-soft:rgba(255,106,31,.1);--glow:0 0 8px rgba(6,182,212,.55);--glass-hi:inset 0 1px 0 rgba(255,255,255,.9);--shadow:0 8px 24px rgba(30,41,82,.08);--shadow-lift:0 16px 40px rgba(30,41,82,.14);--dots:rgba(14,21,37,.04);--pb-blue:rgba(61,99,240,.1);--pf-blue:#2F52D8;--pb-green:rgba(34,197,94,.12);--pf-green:#15803D;--pb-amber:rgba(245,165,36,.16);--pf-amber:#92400E;--pb-red:rgba(244,63,94,.1);--pf-red:#BE123C;--pb-violet:rgba(124,92,224,.1);--pf-violet:#6D28D9;--pb-cyan:rgba(6,182,212,.12);--pf-cyan:#0E7490;--pb-gray:rgba(14,21,37,.06);--pf-gray:#3B4558;color-scheme:light}
.ht .aurora{position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(360px 300px at 10% 4%,rgba(61,99,240,.38),transparent 70%),radial-gradient(320px 280px at 95% 22%,rgba(124,92,224,.28),transparent 70%),radial-gradient(360px 320px at 80% 70%,rgba(45,212,239,.16),transparent 70%),radial-gradient(300px 260px at 10% 92%,rgba(255,106,31,.12),transparent 70%)}
.ht.light .aurora{background:radial-gradient(360px 300px at 10% 4%,rgba(61,99,240,.22),transparent 70%),radial-gradient(320px 280px at 95% 22%,rgba(124,92,224,.16),transparent 70%),radial-gradient(360px 320px at 80% 70%,rgba(6,182,212,.14),transparent 70%),radial-gradient(300px 260px at 10% 92%,rgba(255,106,31,.1),transparent 70%)}
.ht .glass{-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--glass-hi),var(--shadow)}
.ht button,.ht input,.ht select,.ht textarea{font-family:inherit}
.ht select option{background:var(--surface-solid);color:var(--text-1)}
.ht :focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
</style>
</helmet>
<div class="ht {{themeCls}}" style="width: 390px; min-height: 1010px; box-sizing: border-box; padding: 0 0 110px;">
  <div class="aurora" aria-hidden="true"></div>

  <header style="padding: 56px 20px 16px; display: flex; align-items: flex-end; gap: 12px;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;">
      <span style="font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--cyan-text);">Employee directory · 9</span>
      <h1 style="margin: 0; font-family: var(--f-display); font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; color: var(--text-1);">Team</h1>
    </div>
    <button aria-label="Add employee" style="height: 44px; padding: 0 16px 0 12px; border: 0; border-radius: 14px; background: var(--primary); color: #FFFFFF; font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 6px 20px rgba(61,99,240,.35);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      Add
    </button>
  </header>

  <main style="padding: 0 16px; display: flex; flex-direction: column; gap: 12px;">
    <div style="position: relative;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 15px; top: 15px; pointer-events: none;"><path d="M11 3a8 8 0 1 0 0 16 8 8 0 0 0 0-16zM21 21l-4.35-4.35"></path></svg>
      <input type="search" aria-label="Search employees" placeholder="Search name, email or ID" class="glass" style="width: 100%; box-sizing: border-box; height: 48px; padding: 0 14px 0 44px; border: 1px solid var(--line-strong); border-radius: 14px; background: var(--surface); color: var(--text-1); font-size: 15px;">
    </div>

    <div role="radiogroup" aria-label="Filter by status" style="display: flex; gap: 8px;">
      <button role="radio" aria-checked="true" style="height: 44px; padding: 0 16px; border: 1px solid var(--primary); border-radius: 9999px; background: var(--primary); color: #FFFFFF; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px;">
        All <span style="font-family: var(--f-mono); font-size: 12px; opacity: .8;">9</span>
      </button>
      <button role="radio" aria-checked="false" class="glass" style="height: 44px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: 9999px; background: var(--surface); color: var(--text-1); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px;">
        Active <span style="font-family: var(--f-mono); font-size: 12px; color: var(--text-3);">8</span>
      </button>
      <button role="radio" aria-checked="false" class="glass" style="height: 44px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: 9999px; background: var(--surface); color: var(--text-1); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px;">
        Resigned <span style="font-family: var(--f-mono); font-size: 12px; color: var(--text-3);">1</span>
      </button>
    </div>

    <section aria-label="Employee directory" class="glass" style="padding: 4px 16px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); display: flex; flex-direction: column;">
      <sc-for list="{{people}}" as="p" hint-placeholder-count="9">
        <a href="MobileEmployee.dc.html" aria-label="{{p.aria}}" style="display: flex; align-items: center; gap: 12px; min-height: 68px; border-top: {{p.divider}}; text-decoration: none; opacity: {{p.opacity}};">
          <span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 9999px; background: {{p.av}}; color: {{p.avText}}; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center;">{{p.initials}}</span>
          <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 15px; font-weight: 600; color: var(--text-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{p.name}}</span>
            <span style="font-family: var(--f-mono); font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{p.email}}</span>
          </span>
          <span style="height: 22px; padding: 0 8px; flex-shrink: 0; border-radius: 9999px; background: {{p.pillBg}}; color: {{p.pillFg}}; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center;">{{p.status}}</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M9 18l6-6-6-6"></path></svg>
        </a>
      </sc-for>
    </section>
  </main>

  <div style="position: absolute; left: 0; right: 0; bottom: 0;">
    <dc-import name="MobileTabBar" active="team" hint-size="390px,86px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"light":{"editor":"boolean","default":false},"$preview":{"width":390,"height":1010}}'>
class Component extends DCLogic {
  renderVals() {
    const light = this.props.light ?? false;
    const active = { status: 'Active', pillBg: 'var(--pb-green)', pillFg: 'var(--pf-green)', opacity: '1' };
    const resigned = { status: 'Resigned', pillBg: 'var(--pb-red)', pillFg: 'var(--pf-red)', opacity: '.72' };
    const rows = [
      ['Sanish', 'S', 'sanish@heubert.com', '#FF6A1F', '#0A0E17', active],
      ['Aarav Shrestha', 'AS', 'aarav@heubert.com', '#3D63F0', '#FFFFFF', active],
      ['Anisha Rai', 'AR', 'anisha@heubert.com', '#B4471A', '#FFFFFF', active],
      ['Kriti Joshi', 'KJ', 'kriti@heubert.com', '#7C5CE0', '#FFFFFF', active],
      ['Nabin Tamang', 'NT', 'nabin@heubert.com', '#0B7F90', '#FFFFFF', active],
      ['Priya Maharjan', 'PM', 'priya@heubert.com', '#B4471A', '#FFFFFF', active],
      ['Rohan KC', 'RK', 'rohan@heubert.com', '#3D63F0', '#FFFFFF', active],
      ['Sita Gurung', 'SG', 'sita@heubert.com', '#7C5CE0', '#FFFFFF', active],
      ['Bikash Thapa', 'BT', 'bikash@heubert.com', '#0B7F90', '#FFFFFF', resigned]
    ];
    return {
      themeCls: light ? 'light' : '',
      people: rows.map(([name, initials, email, av, avText, st], i) => ({
        name: i === 0 ? 'Sanish (you)' : name,
        initials, email, av, avText, ...st,
        divider: i === 0 ? '0' : '1px solid var(--line)',
        aria: (i === 0 ? 'Sanish, you' : name) + ', ' + st.status + ', ' + email + '. Open profile'
      }))
    };
  }
}
</script>
</body>
</html>
