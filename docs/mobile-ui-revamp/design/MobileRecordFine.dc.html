<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile — Record a fine</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070A12}
a{color:#8EA6FF}a:hover{color:#B7C6FF}
.ht{--tab-bg:rgba(15,20,34,.9);--ink:#070A12;--surface:rgba(22,29,47,.55);--surface-solid:#121828;--surface-strong:rgba(22,29,47,.82);--raised:rgba(255,255,255,.05);--line:rgba(255,255,255,.09);--line-strong:rgba(255,255,255,.17);--text-1:#EDF1F8;--text-2:#B6BFCF;--text-3:#8E98AC;--primary:#3D63F0;--primary-hover:#5174FF;--primary-text:#8EA6FF;--primary-soft:rgba(61,99,240,.18);--cyan:#2DD4EF;--cyan-text:#67E3F5;--orange:#FF6A1F;--orange-hover:#FF8340;--orange-soft:rgba(255,106,31,.14);--unpaid:#F5A524;--glow:0 0 10px rgba(45,212,239,.7);--blur:blur(22px) saturate(160%);--glass-hi:inset 0 1px 0 rgba(255,255,255,.07);--shadow:0 8px 24px rgba(0,0,0,.28);--shadow-lift:0 16px 40px rgba(0,0,0,.45);--dots:rgba(255,255,255,.03);--pb-blue:rgba(61,99,240,.2);--pf-blue:#A5B8FF;--pb-green:rgba(34,197,94,.16);--pf-green:#6EE7A0;--pb-amber:rgba(245,165,36,.16);--pf-amber:#FCC560;--pb-red:rgba(244,63,94,.16);--pf-red:#FDA4B4;--pb-violet:rgba(167,139,250,.18);--pf-violet:#C4B5FD;--pb-cyan:rgba(45,212,239,.14);--pf-cyan:#67E3F5;--pb-gray:rgba(255,255,255,.07);--pf-gray:#B6BFCF;--f-display:'Space Grotesk',system-ui,sans-serif;--f-body:'IBM Plex Sans',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,monospace;position:relative;isolation:isolate;overflow:hidden;font-family:var(--f-body);color:var(--text-2);background-color:var(--ink);background-image:radial-gradient(var(--dots) 1px,transparent 1px);background-size:20px 20px;-webkit-font-smoothing:antialiased;color-scheme:dark}
.ht.light{--tab-bg:rgba(255,255,255,.88);--ink:#EDF1F8;--surface:rgba(255,255,255,.6);--surface-solid:#FFFFFF;--surface-strong:rgba(255,255,255,.86);--raised:rgba(255,255,255,.65);--line:rgba(14,21,37,.08);--line-strong:rgba(14,21,37,.16);--text-1:#0E1525;--text-2:#3B4558;--text-3:#5A6478;--primary-hover:#3254D6;--primary-text:#2F52D8;--primary-soft:rgba(61,99,240,.1);--cyan:#06B6D4;--cyan-text:#0E7490;--orange-soft:rgba(255,106,31,.1);--glow:0 0 8px rgba(6,182,212,.55);--glass-hi:inset 0 1px 0 rgba(255,255,255,.9);--shadow:0 8px 24px rgba(30,41,82,.08);--shadow-lift:0 16px 40px rgba(30,41,82,.14);--dots:rgba(14,21,37,.04);--pb-blue:rgba(61,99,240,.1);--pf-blue:#2F52D8;--pb-green:rgba(34,197,94,.12);--pf-green:#15803D;--pb-amber:rgba(245,165,36,.16);--pf-amber:#92400E;--pb-red:rgba(244,63,94,.1);--pf-red:#BE123C;--pb-violet:rgba(124,92,224,.1);--pf-violet:#6D28D9;--pb-cyan:rgba(6,182,212,.12);--pf-cyan:#0E7490;--pb-gray:rgba(14,21,37,.06);--pf-gray:#3B4558;color-scheme:light}
.ht .aurora{position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(360px 300px at 10% 4%,rgba(61,99,240,.38),transparent 70%),radial-gradient(320px 280px at 95% 22%,rgba(124,92,224,.28),transparent 70%),radial-gradient(360px 320px at 80% 70%,rgba(45,212,239,.16),transparent 70%),radial-gradient(300px 260px at 10% 92%,rgba(255,106,31,.12),transparent 70%)}
.ht.light .aurora{background:radial-gradient(360px 300px at 10% 4%,rgba(61,99,240,.22),transparent 70%),radial-gradient(320px 280px at 95% 22%,rgba(124,92,224,.16),transparent 70%),radial-gradient(360px 320px at 80% 70%,rgba(6,182,212,.14),transparent 70%),radial-gradient(300px 260px at 10% 92%,rgba(255,106,31,.1),transparent 70%)}
.ht .glass{-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--glass-hi),var(--shadow)}
.ht button,.ht input,.ht select,.ht textarea{font-family:inherit}
.ht select option{background:var(--surface-solid);color:var(--text-1)}
.ht :focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
</style>
</helmet>
<div class="ht {{themeCls}}" style="width: 390px; height: 844px; min-height: 844px; box-sizing: border-box; padding: 0;">
  <div class="aurora" aria-hidden="true"></div>

  <div aria-hidden="true" style="padding: 56px 16px 0; display: flex; flex-direction: column; gap: 14px;">
    <div style="padding: 0 4px; display: flex; align-items: flex-end; gap: 12px;">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;">
        <span style="font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--cyan-text);">Records · FY 2083/84</span>
        <span style="font-family: var(--f-display); font-size: 28px; line-height: 1.15; font-weight: 700; color: var(--text-1);">Fines</span>
      </div>
      <span class="glass" style="width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface);"></span>
      <span style="width: 44px; height: 44px; border-radius: 9999px; background: var(--orange);"></span>
    </div>
    <div class="glass" style="height: 52px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface);"></div>
    <div style="display: flex; gap: 8px;">
      <span style="width: 116px; height: 44px; border-radius: 9999px; background: var(--primary-soft); border: 1px solid var(--primary);"></span>
      <span style="width: 104px; height: 44px; border-radius: 9999px; background: var(--surface); border: 1px solid var(--line-strong);"></span>
      <span style="width: 150px; height: 44px; border-radius: 9999px; background: var(--surface); border: 1px solid var(--line-strong);"></span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <span class="glass" style="height: 96px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface);"></span>
      <span class="glass" style="height: 96px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface);"></span>
      <span class="glass" style="height: 96px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface);"></span>
      <span class="glass" style="height: 96px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface);"></span>
    </div>
    <div class="glass" style="height: 64px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface);"></div>
    <div class="glass" style="height: 72px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface);"></div>
    <div class="glass" style="height: 72px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface);"></div>
  </div>

  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(4,6,12,.55); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 8px 20px 34px; border-top: 1px solid var(--line-strong); border-radius: 24px 24px 0 0; background: var(--surface-solid); box-shadow: 0 -16px 48px rgba(0,0,0,.45); display: flex; flex-direction: column; gap: 16px;">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 9999px; background: var(--line-strong);"></span>

    <div style="display: flex; align-items: flex-start; gap: 12px;">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;">
        <h2 id="sheet-title" style="margin: 0; font-family: var(--f-display); font-size: 22px; font-weight: 700; color: var(--text-1);">Record a fine</h2>
        <span style="font-size: 13px; color: var(--text-3);">Goes into <span style="font-family: var(--f-mono); color: var(--cyan-text);">FY 2083/84</span>, the current season.</span>
      </div>
      <a href="MobileFines.dc.html" aria-label="Close" style="width: 44px; height: 44px; flex-shrink: 0; box-sizing: border-box; border: 1px solid var(--line); border-radius: 9999px; background: var(--raised); color: var(--text-2); display: inline-flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="rf-employee" style="font-size: 13px; font-weight: 600; color: var(--text-2);">Employee</label>
      <div style="position: relative;">
        <span aria-hidden="true" style="position: absolute; left: 12px; top: 12px; width: 28px; height: 28px; border-radius: 9999px; background: #3D63F0; color: #FFFFFF; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; pointer-events: none;">RK</span>
        <select id="rf-employee" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0 44px 0 50px; border: 1px solid var(--line-strong); border-radius: 14px; background: var(--raised); color: var(--text-1); font-size: 16px; -webkit-appearance: none; appearance: none;">
          <option>Rohan KC</option>
          <option>Aarav Shrestha</option>
          <option>Sita Gurung</option>
          <option>Bikash Thapa</option>
          <option>Priya Maharjan</option>
          <option>Kriti Joshi</option>
          <option>Nabin Tamang</option>
          <option>Anisha Rai</option>
          <option>Sanish</option>
        </select>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 16px; top: 17px; color: var(--text-3); pointer-events: none;"><path d="M6 9l6 6 6-6"></path></svg>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span id="rf-date-label" style="font-size: 13px; font-weight: 600; color: var(--text-2);">Date</span>
      <button aria-labelledby="rf-date-label rf-date-value" style="height: 52px; box-sizing: border-box; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: 14px; background: var(--raised); color: var(--text-1); display: flex; align-items: center; gap: 10px; text-align: left; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--text-3);"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path></svg>
        <span id="rf-date-value" style="flex-grow: 1; font-family: var(--f-mono); font-size: 15px;">Fri, Oct 16, 2026</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--text-3);"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <span style="padding-left: 4px; font-family: var(--f-mono); font-size: 12px; color: var(--cyan-text);">30 Ashwin 2083 BS</span>
    </div>

    <div role="radiogroup" aria-labelledby="rf-amount-label" style="display: flex; flex-direction: column; gap: 6px;">
      <span id="rf-amount-label" style="font-size: 13px; font-weight: 600; color: var(--text-2);">Amount (Rs.)</span>
      <div style="padding: 4px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; border: 1px solid var(--line-strong); border-radius: 14px; background: var(--raised);">
        <button role="radio" aria-checked="false" style="height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--text-3); font-family: var(--f-mono); font-size: 15px; font-weight: 500;">Rs. 25</button>
        <button role="radio" aria-checked="true" style="height: 44px; border: 0; border-radius: 10px; background: var(--primary-soft); color: var(--primary-text); font-family: var(--f-mono); font-size: 15px; font-weight: 500; box-shadow: inset 0 0 0 1px rgba(61,99,240,.5);">Rs. 50</button>
      </div>
    </div>

    <div role="radiogroup" aria-labelledby="rf-status-label" style="display: flex; flex-direction: column; gap: 6px;">
      <span id="rf-status-label" style="font-size: 13px; font-weight: 600; color: var(--text-2);">Status</span>
      <div style="padding: 4px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; border: 1px solid var(--line-strong); border-radius: 14px; background: var(--raised);">
        <button role="radio" aria-checked="true" style="height: 44px; border: 0; border-radius: 10px; background: var(--pb-amber); color: var(--pf-amber); font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px;">
          <span style="width: 7px; height: 7px; border-radius: 9999px; background: currentColor;" aria-hidden="true"></span>Unpaid
        </button>
        <button role="radio" aria-checked="false" style="height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--text-3); font-size: 15px; font-weight: 500;">Paid</button>
      </div>
    </div>

    <sc-if value="{{showError}}" hint-placeholder-val="{{true}}">
      <div role="alert" style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--pb-red); color: var(--pf-red);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px;"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM12 8v4M12 16h.01"></path></svg>
        <span style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 14px; font-weight: 600;">Already fined for this day</span>
          <span style="font-size: 13px; line-height: 1.4;">Rohan KC has a Rs. 50 late fine on Oct 16. One per person per day, so edit that one instead.</span>
        </span>
      </div>
    </sc-if>

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <button aria-disabled="{{ariaDisabled}}" style="height: 52px; border: 0; border-radius: 14px; background: var(--primary); color: #FFFFFF; font-size: 16px; font-weight: 600; opacity: {{btnOpacity}}; box-shadow: 0 8px 24px rgba(61,99,240,.35); display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
        Record Fine
      </button>
      <a href="MobileFines.dc.html" style="height: 44px; display: inline-flex; align-items: center; justify-content: center; color: var(--text-2); font-size: 15px; font-weight: 600; text-decoration: none;">Cancel</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"light":{"editor":"boolean","default":false},"error":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const light = this.props.light ?? false;
    const error = this.props.error ?? true;
    return {
      themeCls: light ? 'light' : '',
      showError: error,
      ariaDisabled: error ? 'true' : 'false',
      btnOpacity: error ? '0.45' : '1'
    };
  }
}
</script>
</body>
</html>
